<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabulær - Ordjakten</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .word-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin: 0 3px; background-color: #d1d5db; transition: all 0.2s ease; }
        .word-dot.active { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; transform: scale(1.2); }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #ef4444 !important; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <a href="../index.html" class="inline-flex items-center text-sm font-semibold text-slate-600 hover:text-indigo-600 transition mb-6">
    <i class="fa-solid fa-arrow-left mr-2"></i> Tilbake til hovedmenyen </a>

    <div id="app" class="max-w-3xl mx-auto px-4 py-8">
        <header id="main-header" class="text-center mb-10">
            <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 mb-2">Vokabulær</h1>
            <p class="text-slate-600">Bli en mester i norsk rettskriving gjennom ordjakten</p>
        </header>

        <!-- Mode Selection (Nå kun Ordjakten) -->
        <div id="mode-selection" class="max-w-md mx-auto mb-8">
            <button onclick="showDifficultySelection()" class="w-full group p-8 bg-white border-2 border-slate-200 rounded-2xl hover:border-blue-500 hover:shadow-xl transition-all text-center">
                <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mb-4 mx-auto group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>
                <h2 class="text-2xl font-bold mb-2">Start ordjakten</h2>
                <p class="text-slate-500">Gjett ordet basert på definisjonen. Du får +5 sekunder per riktig svar!</p>
            </button>
        </div>

        <!-- Difficulty Selection -->
        <div id="difficulty-ui" class="hidden bg-white rounded-3xl shadow-lg p-8">
            <button onclick="backToMenu()" class="mb-6 flex items-center text-slate-500 hover:text-blue-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg> Tilbake
            </button>
            <h2 class="text-2xl font-bold mb-6 text-center">Velg vanskelighetsgrad</h2>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="startOrdjakt('lett')" class="p-4 rounded-xl border-2 border-green-100 hover:bg-green-50 transition-colors flex justify-between items-center">
                    <div class="text-left"><div class="font-bold text-green-700">Lett</div><div class="text-xs text-green-600">Hverdagsord og enkle begreper</div></div>
                    <span class="text-2xl">🌱</span>
                </button>
                <button onclick="startOrdjakt('middels')" class="p-4 rounded-xl border-2 border-blue-100 hover:bg-blue-50 transition-colors flex justify-between items-center">
                    <div class="text-left"><div class="font-bold text-blue-700">Middels</div><div class="text-xs text-blue-600">Vanlige bruksord og abstrakte termer</div></div>
                    <span class="text-2xl">🚀</span>
                </button>
                <button onclick="startOrdjakt('vanskelig')" class="p-4 rounded-xl border-2 border-purple-100 hover:bg-purple-50 transition-colors flex justify-between items-center">
                    <div class="text-left"><div class="font-bold text-purple-700">Vanskelig</div><div class="text-xs text-purple-600">Akademiske og sjeldne ord</div></div>
                    <span class="text-2xl">🧠</span>
                </button>
            </div>
        </div>

        <!-- Ordjakt Interface -->
        <div id="ordjakt-ui" class="hidden bg-white rounded-3xl shadow-lg p-8">
            <div class="flex justify-between items-center mb-8">
                <div class="text-2xl font-mono font-bold text-blue-600" id="timer">01:00</div>
                <div class="text-2xl font-mono font-bold text-slate-800" id="score">0</div>
            </div>
            <div class="text-center py-10" id="game-content-area">
                <div id="word-category" class="text-xs font-bold uppercase mb-4 tracking-widest text-slate-400">KATEGORI</div>
                <h3 id="word-definition" class="text-2xl font-medium text-slate-800 leading-relaxed mb-8 italic min-h-[4rem]">Laster...</h3>
                <div class="flex flex-col items-center">
                    <div id="dots-container" class="mb-6 flex justify-center flex-wrap gap-2"></div>
                    <div class="relative w-full max-w-sm">
                        <span id="first-letter-hint" class="absolute left-4 top-1/2 -translate-y-1/2 text-3xl font-bold text-blue-500 opacity-50">?</span>
                        <input type="text" id="word-input" autocomplete="off" class="w-full text-3xl font-bold text-center tracking-widest border-b-4 border-slate-200 py-4 focus:outline-none focus:border-blue-500 transition-all uppercase pl-10">
                    </div>
                </div>
            </div>
            <div class="flex justify-between mt-8">
                <button onclick="backToMenu()" class="text-slate-400 font-medium hover:text-slate-600">Avslutt</button>
                <button onclick="nextWord(currentDiff)" class="bg-slate-100 px-6 py-2 rounded-xl font-bold hover:bg-slate-200 transition-colors">Hopp over</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center">
            <h2 class="text-3xl font-extrabold mb-2">Tiden er ute!</h2>
            <p id="final-stats-summary" class="text-slate-500 mb-6"></p>
            <div class="bg-slate-50 rounded-2xl p-4 mb-6 text-left border border-slate-100">
                <div class="text-xs font-bold text-slate-400 uppercase">Riktig ord var:</div>
                <div id="last-word-reveal" class="text-xl font-bold text-blue-600"></div>
                <div id="last-def-reveal" class="text-sm text-slate-600 italic"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeGameOver()" class="bg-slate-100 py-3 rounded-xl font-bold">Meny</button>
                <button onclick="restartGame()" class="bg-blue-600 text-white py-3 rounded-xl font-bold">Prøv igjen</button>
            </div>
        </div>
    </div>

        let currentWord, score = 0, solvedCount = 0, timeLeft = 60, timerInterval, currentDiff = 'lett';

        function showDifficultySelection() { 
            document.getElementById('mode-selection').classList.add('hidden'); 
            document.getElementById('difficulty-ui').classList.remove('hidden'); 
        }

        function backToMenu() { 
            clearInterval(timerInterval);
            document.getElementById('difficulty-ui').classList.add('hidden');
            document.getElementById('ordjakt-ui').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('mode-selection').classList.remove('hidden');
        }

        function startOrdjakt(diff) {
            currentDiff = diff;
            document.getElementById('difficulty-ui').classList.add('hidden');
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('ordjakt-ui').classList.remove('hidden');
            score = 0; solvedCount = 0; timeLeft = 60;
            document.getElementById('score').innerText = score;
            nextWord(diff);
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60), secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
            document.getElementById('word-input').focus();
        }

        function nextWord(diff) {
            const list = ordlister[diff] || ordlister.lett;
            // Unngå samme ord to ganger på rad hvis mulig
            let newWord;
            do {
                newWord = list[Math.floor(Math.random() * list.length)];
            } while (newWord === currentWord && list.length > 1);
            
            currentWord = newWord;
            document.getElementById('word-definition').innerText = currentWord.def;
            document.getElementById('word-category').innerText = currentWord.kat;
            document.getElementById('first-letter-hint').innerText = currentWord.ord[0];
            document.getElementById('word-input').value = "";
            
            const dc = document.getElementById('dots-container');
            dc.innerHTML = "";
            for (let i = 0; i < currentWord.ord.length; i++) {
                const dot = document.createElement('span');
                dot.className = "word-dot" + (i === 0 ? " active" : "");
                dc.appendChild(dot);
            }
        }

        document.getElementById('word-input').addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase();
            // Ordet starter alltid med den gitte bokstaven (hint)
            const currentGuess = currentWord.ord[0] + val;
            
            const dots = document.querySelectorAll('.word-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i < currentGuess.length));
            
            if (!currentWord.ord.startsWith(currentGuess)) {
                e.target.classList.add('shake'); 
                setTimeout(() => e.target.classList.remove('shake'), 400);
                e.target.value = val.slice(0, -1);
            } else if (currentGuess === currentWord.ord) {
                score += 10; solvedCount++; timeLeft += 5;
                document.getElementById('score').innerText = score;
                nextWord(currentDiff);
            }
        });

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('last-word-reveal').innerText = currentWord.ord;
            document.getElementById('last-def-reveal').innerText = currentWord.def;
            document.getElementById('final-stats-summary').innerText = `Poeng: ${score} | Løste ord: ${solvedCount}`;
            document.getElementById('game-over-modal').classList.remove('hidden');
        }

        function restartGame() { 
            document.getElementById('game-over-modal').classList.add('hidden'); 
            startOrdjakt(currentDiff); 
        }
        
        function closeGameOver() { 
            document.getElementById('game-over-modal').classList.add('hidden'); 
            backToMenu(); 
        }
