<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glose-Duell: Matrix Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { --matrix-green: #00FF41; --matrix-dark: #000800; --matrix-glow: rgba(0, 255, 65, 0.2); }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: var(--matrix-dark);
            font-family: 'Share Tech Mono', monospace;
            color: var(--matrix-green);
        }

        .scroll-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px 0 80px 0;
            -webkit-overflow-scrolling: touch;
        }

        .matrix-border { border: 1px solid var(--matrix-green); box-shadow: 0 0 15px var(--matrix-glow); }
        .btn-matrix { border: 1px solid var(--matrix-green); background: transparent; color: var(--matrix-green); transition: all 0.2s; text-transform: uppercase; cursor: pointer; }
        .btn-matrix:hover:not(:disabled) { background: var(--matrix-green); color: var(--matrix-dark); box-shadow: 0 0 20px var(--matrix-green); }
        .btn-matrix:disabled { opacity: 0.3; cursor: not-allowed; border-color: #004400; color: #004400; }
        input, select { background: rgba(0, 20, 0, 0.8) !important; border: 1px solid var(--matrix-green) !important; color: var(--matrix-green) !important; outline: none; }
        
        .console-log { font-size: 10px; height: 120px; overflow-y: auto; background: rgba(0, 5, 0, 0.95); border-top: 2px solid #004400; width: 100%; position: fixed; bottom: 0; left: 0; z-index: 100; transition: transform 0.3s ease-in-out; }
        .console-collapsed { transform: translateY(120px); }
        .console-expanded { transform: translateY(0); }
        
        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 65, 0.1); position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none; animation: scan 8s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .result-text { font-size: clamp(1.2rem, 6.5vw, 3rem); white-space: nowrap; text-align: center; display: block; width: 100%; }

        @keyframes glitch-flash {
            0% { background-color: rgba(239, 68, 68, 0.4); border-color: #ef4444; }
            100% { background-color: transparent; }
        }
        .damage-flash {
            animation: glitch-flash 0.5s ease-out;
        }
    </style>
</head>
<body>
    <canvas id="matrix-rain" class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-65"></canvas>

    <div class="scanline"></div>
    <div id="root" style="width: 100%; height: 100%; position: relative;"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyA1DWXb3N2JkkTSRBM6LCGtzq8O-axTexg",
            authDomain: "norskspill-564a7.firebaseapp.com",
            projectId: "norskspill-564a7",
            databaseURL: "https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "norskspill-564a7.firebasestorage.app",
            messagingSenderId: "613491554297",
            appId: "1:613491554297:web:ee9b629fbcf306aeaeaf28"
        };

        // GitHub Base-URL for JSON-filer uten låst commit-hash for alltid å hente NYESTE versjon
        const GITHUB_JSON_BASE_URL = "https://gist.githubusercontent.com/hinsverk/4d3974a3f872a300d212b9ff275efc21/raw/matrix.json";

        const LOCAL_FALLBACKS = {
            NORSK1: {
                name: "Oversettelse fra bokmål til nynorsk (Backup)",
                words: [
                    { q: "hun", a: "ho" },
                    { q: "Katt", a: "Cat" },
                    { q: "Hund", a: "Dog" },
                    { q: "Hus", a: "House" }
                ]
            },
            NORSK2: {
                name: "Synonymer på bokmål (Backup)",
                words: [
                    { q: "Glad", a: "Lykkelig" },
                    { q: "Beslutning", a: "Decision" },
                    { q: "Erfaring", a: "Experience" }
                ]
            }
        };

        // Hjelpefunksjon for å normalisere ulike nøkkelnavn i JSON (f.eks. bokmaal/nynorsk, ord/synonym, q/a)
        const normalizeGloseItem = (item) => {
            if (!item) return { q: "", a: "" };
            if (item.q !== undefined && item.a !== undefined) {
                return { q: String(item.q), a: String(item.a) };
            }
            if (item.bokmaal !== undefined && item.nynorsk !== undefined) {
                return { q: String(item.bokmaal), a: String(item.nynorsk) };
            }
            if (item.ord !== undefined && item.synonym !== undefined) {
                return { q: String(item.ord), a: String(item.synonym) };
            }
            // Generell fallback hvis fremtidige lister har andre nøkkelnavn
            const keys = Object.keys(item);
            if (keys.length >= 2) {
                return { q: String(item[keys[0]]), a: String(item[keys[1]]) };
            }
            return { q: String(item.q || item.ord || item.bokmaal || ""), a: String(item.a || item.synonym || item.nynorsk || "") };
        };

        const START_HP = 150;
        const DAMAGE_PER_HIT = 10;

        const App = () => {
            const [view, setView] = useState('landing');
            const [logs, setLogs] = useState(["[SYS] Core Init..."]);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState("");
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [showConsole, setShowConsole] = useState(false); 
            
            const [playerName, setPlayerName] = useState(() => sessionStorage.getItem('glose_name') || "Operator_" + Math.floor(Math.random()*99));
            const [listCode, setListCode] = useState("NORSK1");
            const [gamePin, setGamePin] = useState("");
            const [isMultiplayer, setIsMultiplayer] = useState(false);
            const [isHost, setIsHost] = useState(false);
            const [gameMode, setGameMode] = useState("duel");
            const [playerHP, setPlayerHP] = useState(START_HP);
            const [opponentHP, setOpponentHP] = useState(START_HP);
            const [opponentName, setOpponentName] = useState("Sentinel");
            const [allGloser, setAllGloser] = useState([]);
            const [listTitle, setListTitle] = useState("");
            const [gameState, setGameState] = useState({ input: "", currentGlose: null, feedback: null });
            const [playersInRoom, setPlayersInRoom] = useState([]);
            const [showHint, setShowHint] = useState(false);
            
            const prevPlayersHP = useRef({});
            const scrollContainerRef = useRef(null);
            
            const [playerId] = useState(() => {
                const id = sessionStorage.getItem('glose_uid') || "usr_" + Math.random().toString(36).substring(2, 8);
                sessionStorage.setItem('glose_uid', id);
                return id;
            });

            const [availableLists, setAvailableLists] = useState([
                { code: "NORSK1", name: LOCAL_FALLBACKS.NORSK1.name },
                { code: "NORSK2", name: LOCAL_FALLBACKS.NORSK2.name }
            ]);
            
            const [authToken, setAuthToken] = useState("");
            const [githubStatus, setGithubStatus] = useState({ state: "loading", msg: "Sjekker GitHub..." });
            const logEndRef = useRef(null);

            const addLog = (msg) => {
                const time = new Date().toLocaleTimeString();
                setLogs(prev => [...prev.slice(-25), `[${time}] ${msg}`]);
            };

            const loadAvailableCategories = async () => {
                setGithubStatus({ state: "loading", msg: "Kobler til GitHub..." });
                try {
                    const res = await fetch(`${GITHUB_JSON_BASE_URL}?t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.kategorier && Array.isArray(data.kategorier)) {
                            const list = data.kategorier.map(cat => ({
                                code: cat.id,
                                name: cat.navn || cat.id
                            }));
                            if (list.length > 0) {
                                setAvailableLists(list);
                                setGithubStatus({ state: "ok", msg: `🟢 GitHub Tilkoblet: ${list.length} kategorier funnet!` });
                                addLog(`Dynamisk hentet ${list.length} kategorier fra GitHub JSON.`);
                            }
                        } else {
                            setGithubStatus({ state: "warning", msg: "⚠️ Svar mottatt, men ingen 'kategorier'-liste funnet." });
                        }
                    } else {
                        setGithubStatus({ state: "error", msg: `🔴 Kunne ikke koble til GitHub (Status: ${res.status})` });
                    }
                } catch (e) {
                    setGithubStatus({ state: "error", msg: `🔴 GitHub-feil: ${e.message}` });
                    addLog("Kunne ikke laste dynamisk kategoriliste.");
                }
            };

            useEffect(() => {
                loadAvailableCategories();
            }, []);

            useEffect(() => {
                if (!isMultiplayer || !gamePin) return;

                let active = true;
                const pollDatabase = async () => {
                    try {
                        const tokenParam = authToken ? `?auth=${authToken}` : '';
                        const res = await fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}.json${tokenParam}`);
                        if (!res.ok) return;
                        
                        const data = await res.json();
                        if (!active) return;

                        if (data) {
                            if (data.gameMode && data.gameMode !== gameMode) {
                                setGameMode(data.gameMode);
                            }
                            if (data.status === 'active' && view === 'lobby') {
                                addLog("Sequence STARTING...");
                                setNextGlose();
                                setView('game');
                            }
                            const playersMap = data.players || {};
                            const playersList = Object.keys(playersMap).map(id => ({
                                id,
                                name: playersMap[id].name || "Anonymous",
                                hp: playersMap[id].hp !== undefined ? playersMap[id].hp : START_HP
                            }));
                            setPlayersInRoom(playersList);

                            const myStatus = playersMap[playerId];
                            if (myStatus && myStatus.hp !== undefined) {
                                setPlayerHP(myStatus.hp);
                            }
                            if (data.gameMode === 'duel') {
                                const opponent = playersList.find(p => p.id !== playerId);
                                if (opponent) {
                                    setOpponentHP(opponent.hp);
                                    setOpponentName(opponent.name);
                                }
                            }
                        }
                    } catch (err) {}
                };

                const interval = setInterval(pollDatabase, 1200);
                pollDatabase();

                return () => {
                    active = false;
                    clearInterval(interval);
                };
            }, [isMultiplayer, gamePin, isHost, view, authToken, gameMode, playerId]);

            useEffect(() => {
                if (view === 'game') {
                    if (!isMultiplayer) {
                        if (playerHP <= 0) {
                            setTimeout(() => setView('result'), 800);
                        }
                    } else if (gameMode === 'duel') {
                        if (playerHP <= 0 || opponentHP <= 0) {
                            setTimeout(() => setView('result'), 800);
                        }
                    } else if (gameMode === 'royale') {
                        const activePlayers = playersInRoom.filter(p => p.hp > 0);
                        if (playersInRoom.length > 1 && activePlayers.length <= 1) {
                            setTimeout(() => setView('result'), 800);
                        }
                    }
                }
            }, [playerHP, opponentHP, playersInRoom, view, gameMode, isMultiplayer]);

            const cacheListToFirebase = async (code, listData) => {
                try {
                    const tokenParam = authToken ? `?auth=${authToken}` : '';
                    const url = `https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/lists/${code}.json${tokenParam}`;
                    await fetch(url, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(listData)
                    });
                    addLog(`Cached ${code} globally in Firebase.`);
                } catch (e) {
                    addLog("Cache write skipped.");
                }
            };

            const fetchWords = async (code, forceRefresh = false) => {
                const cleanCode = code.toUpperCase().trim();

                if (!forceRefresh) {
                    try {
                        const tokenParam = authToken ? `?auth=${authToken}` : '';
                        const dbRes = await fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/lists/${cleanCode}.json${tokenParam}`);
                        if (dbRes.ok) {
                            const cachedData = await dbRes.json();
                            if (cachedData && cachedData.words) {
                                addLog(`Loaded from Firebase Cache [${cleanCode}]`);
                                return cachedData;
                            }
                        }
                    } catch (e) {}
                } else {
                    addLog(`BYPASSING CACHE: Requesting fresh JSON assets for [${cleanCode}] from GitHub...`);
                }

                try {
                    const response = await fetch(`${GITHUB_JSON_BASE_URL}?t=${Date.now()}`);
                    if (response.ok) {
                        const data = await response.json();
                        
                        // Håndterer struktur med "kategorier"-array
                        if (data.kategorier && Array.isArray(data.kategorier)) {
                            const category = data.kategorier.find(cat => cat.id && cat.id.toUpperCase() === cleanCode);
                            if (category && category.ord) {
                                const formatted = {
                                    name: category.navn || category.id,
                                    words: category.ord.map(normalizeGloseItem)
                                };
                                addLog(`Kategori '${cleanCode}' hentet fra GitHub.`);
                                cacheListToFirebase(cleanCode, formatted);
                                return formatted;
                            }
                        }

                        // Fallback for flat/direkte struktur
                        if (data[cleanCode] && data[cleanCode].words) {
                            const formatted = {
                                name: data[cleanCode].name || cleanCode,
                                words: data[cleanCode].words.map(normalizeGloseItem)
                            };
                            addLog(`Hentet [${cleanCode}] fra GitHub.`);
                            cacheListToFirebase(cleanCode, formatted);
                            return formatted;
                        }
                    }
                } catch (err) {
                    addLog(`GitHub fetch error: ${err.message}`);
                }

                if (LOCAL_FALLBACKS[cleanCode]) {
                    addLog("GitHub JSON fetch failed. Using emergency local fallback.");
                    return LOCAL_FALLBACKS[cleanCode];
                }

                throw new Error("Kunne ikke laste ordliste.");
            };

            const forceRefreshCurrentList = async () => {
                if (isRefreshing) return;
                setIsRefreshing(true);
                setError("");
                try {
                    const freshData = await fetchWords(listCode, true);
                    if (freshData) {
                        setAvailableLists(prev => prev.map(item => 
                            item.code === listCode ? { ...item, name: freshData.name || item.name } : item
                        ));
                        addLog(`SUCCESS: Cache cleared & updated for ${listCode}!`);
                        alert(`Liste '${listCode}' ble oppdatert med nye ord fra GitHub!`);
                    }
                } catch (e) {
                    setError("Kunne ikke synkronisere med GitHub. Sjekk koden eller URL.");
                } finally {
                    setIsRefreshing(false);
                }
            };

            const handleHost = async () => {
                if (isLoading) return;
                setIsLoading(true); setError("");
                try {
                    const data = await fetchWords(listCode, false);
                    const pin = Math.floor(1000 + Math.random() * 8999).toString();
                    
                    setAllGloser(data.words);
                    setListTitle(data.name || "Glose-Liste");
                    setGamePin(pin);
                    setIsHost(true);
                    setIsMultiplayer(true);
                    setPlayerHP(START_HP);
                    setOpponentHP(START_HP);
                    setView('lobby'); 

                    const tokenParam = authToken ? `?auth=${authToken}` : '';
                    await fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${pin}.json${tokenParam}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            host: playerName,
                            listCode: listCode,
                            listTitle: data.name || "Glose-Liste",
                            status: 'waiting',
                            gameMode: gameMode,
                            players: { [playerId]: { name: playerName, hp: START_HP } }
                        })
                    });
                } catch (e) {
                    setError("Host feilet.");
                } finally { setIsLoading(false); }
            };

            const handleJoin = async () => {
                if (!gamePin || isLoading) return setError("PIN required.");
                setIsLoading(true); setError("");
                try {
                    const tokenParam = authToken ? `?auth=${authToken}` : '';
                    const roomRes = await fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}.json${tokenParam}`);
                    const room = await roomRes.json();
                    if (!room) throw new Error("Node ikke funnet.");

                    if (room.gameMode === 'duel' && room.players && Object.keys(room.players).length >= 2 && !room.players[playerId]) {
                        throw new Error("Duell-rommet er fullt (Kun 2 spillere).");
                    }

                    const data = await fetchWords(room.listCode, false);
                    setAllGloser(data.words);
                    setListTitle(room.listTitle);
                    setGameMode(room.gameMode || 'duel');
                    setIsHost(false);
                    setIsMultiplayer(true);
                    setPlayerHP(START_HP);
                    setOpponentHP(START_HP);
                    setView('lobby');

                    await fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}/players/${playerId}.json${tokenParam}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: playerName, hp: START_HP })
                    });
                } catch (e) { setError(e.message || "Tilkobling feilet."); }
                finally { setIsLoading(false); }
            };

            const handleSingle = async () => {
                setIsLoading(true); setError("");
                try {
                    const data = await fetchWords(listCode, false);
                    setAllGloser(data.words);
                    setListTitle(data.name || "Solo Trening");
                    setIsMultiplayer(false);
                    setIsHost(false);
                    setPlayerHP(START_HP);
                    
                    const rand = data.words[Math.floor(Math.random()*data.words.length)];
                    setGameState({ input: "", currentGlose: rand, feedback: null });
                    setView('game');
                } catch (e) {}
                finally { setIsLoading(false); }
            };

            const startGame = () => {
                if (isHost && gamePin) {
                    const tokenParam = authToken ? `?auth=${authToken}` : '';
                    fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}/status.json${tokenParam}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify("active")
                    });
                }
            };

            const exitGame = () => {
                setIsMultiplayer(false);
                setView('landing');
            };

            const setNextGlose = () => {
                if (allGloser.length === 0) return;
                const rand = allGloser[Math.floor(Math.random()*allGloser.length)];
                setGameState({ input: "", currentGlose: rand, feedback: null });
                setShowHint(false); 
            };

            const checkAnswer = (e) => {
                e.preventDefault();
                if (gameState.feedback || !gameState.currentGlose || (isMultiplayer && playerHP <= 0)) return;

                const user = gameState.input.trim().toLowerCase();
                
                const correctAnswers = gameState.currentGlose.a.split(/[/,;]/).map(ans => ans.trim().toLowerCase());
                const isCorrect = correctAnswers.includes(user);
                
                if (isCorrect) {
                    setGameState(p => ({ ...p, feedback: "✓ DATA MATCHED" }));
                    
                    const newMyHP = Math.min(START_HP * 1.5, playerHP + 5);
                    setPlayerHP(newMyHP);

                    if (isMultiplayer) {
                        const tokenParam = authToken ? `?auth=${authToken}` : '';
                        
                        fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}/players/${playerId}/hp.json${tokenParam}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newMyHP)
                        });

                        if (gameMode === 'duel') {
                            const newOppHP = Math.max(0, opponentHP - DAMAGE_PER_HIT);
                            setOpponentHP(newOppHP);
                            const targetId = playersInRoom.find(p => p.id !== playerId)?.id;
                            if (targetId) {
                                fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}/players/${targetId}/hp.json${tokenParam}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newOppHP) });
                            }
                        } else if (gameMode === 'royale') {
                            const activeOpponents = playersInRoom.filter(p => p.id !== playerId && p.hp > 0);
                            if (activeOpponents.length > 0) {
                                const target = activeOpponents[Math.floor(Math.random() * activeOpponents.length)];
                                const targetNewHP = Math.max(0, target.hp - DAMAGE_PER_HIT);
                                fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}/players/${target.id}/hp.json${tokenParam}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(targetNewHP) });
                            }
                        }
                    }
                    setTimeout(setNextGlose, 600);
                } else {
                    setGameState(p => ({ ...p, feedback: "✗ BREACH DETECTED" }));
                    const newHP = Math.max(0, playerHP - DAMAGE_PER_HIT);
                    setPlayerHP(newHP);
                    if (isMultiplayer) {
                        const tokenParam = authToken ? `?auth=${authToken}` : '';
                        fetch(`https://norskspill-564a7-default-rtdb.europe-west1.firebasedatabase.app/rooms/${gamePin}/players/${playerId}/hp.json${tokenParam}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newHP) });
                    }
                    setTimeout(() => setGameState(p => ({ ...p, feedback: null })), 1000);
                }
            };

            const getRoyaleWinner = () => {
                const active = playersInRoom.filter(p => p.hp > 0);
                if (active.length === 1) return active[0].name;
                return "Unknown Node";
            };

            const getHPColorClass = (hp) => {
                if (hp <= 0) return 'text-zinc-600';
                if (hp <= 40) return 'text-red-500';
                if (hp <= 100) return 'text-yellow-400';
                return 'text-green-400'; 
            };

            const getHPBarColorClass = (hp) => {
                if (hp <= 40) return 'bg-red-500';
                if (hp <= 100) return 'bg-yellow-400';
                return 'bg-green-400';
            };

            useEffect(() => {
                if (playersInRoom.length > 0) {
                    const currentHPMap = {};
                    playersInRoom.forEach(p => { currentHPMap[p.id] = p.hp; });
                    prevPlayersHP.current = currentHPMap;
                }
            }, [playersInRoom]);

            return (
                <div ref={scrollContainerRef} className="scroll-container">
                    <div className="w-full max-w-xl mx-auto px-4 space-y-4">
                        {view === 'landing' && (
                            <div className="bg-black/85 p-6 sm:p-8 matrix-border text-center space-y-6">
                                <h1 className="text-3xl font-bold text-white tracking-tighter">NEURAL_DECODER v2.5</h1>
                                
                                {/* VISUELL STATUS-INDIKATOR FOR GITHUB */}
                                <div className={`text-xs p-2.5 border rounded font-mono flex justify-between items-center ${
                                    githubStatus.state === 'ok' ? 'bg-green-950/40 border-green-500/50 text-green-400' :
                                    githubStatus.state === 'loading' ? 'bg-yellow-950/40 border-yellow-500/50 text-yellow-400 animate-pulse' :
                                    'bg-red-950/40 border-red-500/50 text-red-400'
                                }`}>
                                    <span>{githubStatus.msg}</span>
                                    <button 
                                        onClick={loadAvailableCategories}
                                        title="Sjekk GitHub på nytt"
                                        className="ml-2 px-2 py-0.5 border border-current text-[10px] hover:bg-white/10 uppercase transition-all"
                                    >
                                        ⟳ Sjekk på nytt
                                    </button>
                                </div>

                                <input className="w-full p-3 text-center" placeholder="ID" value={playerName} onChange={e => setPlayerName(e.target.value)} />
                                <div className="grid grid-cols-1 gap-4">
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
                                        <div className="flex flex-col space-y-1">
                                            <span className="text-[10px] text-green-500/60 uppercase tracking-widest font-mono">Ordliste ({availableLists.length}):</span>
                                            <select className="p-3 w-full" value={listCode} onChange={e => setListCode(e.target.value)}>
                                                {availableLists.map(list => (
                                                    <option key={list.code} value={list.code}>{list.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="flex flex-col space-y-1">
                                            <span className="text-[10px] text-green-500/60 uppercase tracking-widest font-mono">Modus:</span>
                                            <select className="p-3 bg-black text-green-400 border border-green-400 font-mono w-full" value={gameMode} onChange={e => setGameMode(e.target.value)}>
                                                <option value="duel">Duell (1v1)</option>
                                                <option value="royale">Battle Royale</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center text-xs border border-green-950/60 bg-green-950/10 p-2.5 rounded font-mono">
                                        <span className="text-[10px] text-green-500/40 uppercase tracking-wider">Kilde: GitHub JSON</span>
                                        <button 
                                            onClick={forceRefreshCurrentList}
                                            disabled={isRefreshing}
                                            title="Hent endringer direkte fra GitHub"
                                            className="py-1 px-3 border border-yellow-600/80 text-yellow-500 hover:bg-yellow-600 hover:text-black font-bold text-[10px] uppercase transition-all duration-200"
                                        >
                                            {isRefreshing ? "SYNCING..." : "⟳ Oppdater fra GitHub"}
                                        </button>
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={handleHost} disabled={isLoading || isRefreshing} className="btn-matrix flex-1 p-3">
                                            Host Node
                                        </button>
                                        <div className="flex flex-1 gap-1">
                                            <input className="w-16 text-center" placeholder="PIN" value={gamePin} onChange={e => setGamePin(e.target.value)} />
                                            <button onClick={handleJoin} disabled={isLoading || isRefreshing} className="btn-matrix flex-1 p-3">
                                                Join
                                            </button>
                                        </div>
                                    </div>
                                    <button onClick={handleSingle} disabled={isLoading || isRefreshing} className="btn-matrix p-4 font-bold bg-green-900/10">Solo Trening</button>
                                    
                                    {error && (
                                            <div className="p-3 border border-red-900 bg-red-950/20">
                                                <p className="text-red-500 text-[10px] uppercase font-bold animate-pulse">{error}</p>
                                            </div>
                                    )}

                                    {/* TERMINAL LOGG-SKUFF TOGGLE */}
                                    <div className="text-left pt-2 border-t border-green-950">
                                        <button 
                                            onClick={() => setShowConsole(!showConsole)} 
                                            className="text-[10px] text-green-600 hover:text-green-400 font-mono flex items-center gap-1"
                                        >
                                            <span>{showConsole ? '▼ Skjul' : '▲ Vis'} systemkonsoll ({logs.length} logg-oppføringer)</span>
                                        </button>
                                        {showConsole && (
                                            <div className="mt-2 p-2 bg-black border border-green-900 font-mono text-[10px] h-32 overflow-y-auto text-green-400/80 space-y-1">
                                                {logs.map((log, idx) => (
                                                    <div key={idx}>{log}</div>
                                                ))}
                                                <div ref={logEndRef} />
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'lobby' && (
                            <div className="bg-black/90 p-10 matrix-border text-center space-y-6">
                                <div>
                                    <p className="text-[10px] opacity-50 mb-1">NODE_ADDRESS</p>
                                    <h2 className="text-6xl font-bold text-white tracking-widest">{gamePin}</h2>
                                    <p className="text-[10px] text-green-500/80 mt-1">MODUS: {gameMode === 'duel' ? '1v1 DUELL' : 'BATTLE ROYALE'}</p>
                                </div>
                                <p className="text-xl uppercase border-y border-green-900 py-2">{listTitle}</p>
                                
                                <div className="space-y-2 max-h-48 overflow-y-auto p-2 border border-green-900/50 bg-black/40">
                                    <p className="text-[10px] opacity-40 text-left uppercase">Connected Nodes ({playersInRoom.length}):</p>
                                    {playersInRoom.map((p, index) => (
                                        <div key={p.id} className="flex justify-between items-center text-xs border-b border-green-950/40 py-1">
                                            <p className="font-mono text-white">[{index + 1}] {p.name} {p.id === playerId && " (YOU)"}</p>
                                            <p className="text-[10px] px-1.5 py-0.5 bg-green-950 text-green-300 rounded font-bold">READY</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-4 pt-2">
                                    {isHost ? (
                                        <button onClick={startGame} className="btn-matrix p-5 w-full font-bold text-2xl">Execute Duel</button>
                                    ) : (
                                        <div className="py-4">
                                            <p className="animate-pulse text-sm uppercase tracking-widest">Awaiting Host Authorization...</p>
                                        </div>
                                    )}
                                    <button onClick={exitGame} className="text-[10px] uppercase opacity-40 hover:opacity-100 transition-colors">Abort Session</button>
                                </div>
                            </div>
                        )}

                        {view === 'game' && gameState.currentGlose && (
                            <div className="space-y-4">
                                {/* TILBAKE / AVBRYT KNAPP I SPILLMODUS */}
                                <div className="flex justify-between items-center px-1">
                                    <button 
                                        onClick={exitGame} 
                                        className="text-[10px] text-green-500/70 hover:text-green-300 border border-green-900/60 px-2.5 py-1 bg-black/60 hover:bg-green-950/40 transition-all font-mono uppercase rounded flex items-center gap-1"
                                    >
                                        <span>←</span> Avbryt spill
                                    </button>
                                    <span className="text-[10px] opacity-40 uppercase font-mono">{listTitle}</span>
                                </div>

                                {isMultiplayer ? (
                                    gameMode === 'duel' ? (
                                        <div className="flex justify-between items-center bg-black/80 p-4 matrix-border">
                                            <div className="w-5/12">
                                                <p className="text-[10px] truncate">{playerName} [{playerHP}/{START_HP} HP]</p>
                                                <div className="h-1.5 bg-gray-900"><div className="h-full bg-green-500 transition-all duration-500" style={{width: `${Math.min(100, (playerHP / START_HP) * 100)}%`}}></div></div>
                                            </div>
                                            <div className="px-2 text-red-500 font-bold text-xs uppercase">1v1</div>
                                            <div className="w-5/12 text-right">
                                                <p className="text-[10px] truncate">{opponentName} [{opponentHP}/{START_HP} HP]</p>
                                                <div className="h-1.5 bg-gray-900"><div className="h-full bg-red-600 transition-all duration-500" style={{width: `${Math.min(100, (opponentHP / START_HP) * 100)}%`}}></div></div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-black/80 p-3 matrix-border space-y-1.5">
                                            <p className="text-[9px] opacity-40 uppercase">Battle Royale Monitor:</p>
                                            <div className="grid grid-cols-2 gap-2 text-[10px] max-h-32 overflow-y-auto font-mono">
                                                {playersInRoom.map(p => {
                                                    const prevHP = prevPlayersHP.current[p.id];
                                                    const tookDamage = prevHP !== undefined && p.hp < prevHP;
                                                    const colorClass = getHPColorClass(p.hp);
                                                    return (
                                                        <div key={p.id} className={`flex flex-col p-1.5 border transition-all duration-300 ${tookDamage ? 'damage-flash' : ''} ${p.id === playerId ? 'border-green-400 bg-green-950/10' : p.hp <= 0 ? 'border-zinc-800 bg-zinc-950/20' : 'border-green-950'} rounded`}>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className={`truncate max-w-[110px] font-bold ${colorClass}`}>{p.name} {p.id === playerId && " (YOU)"}</span>
                                                                <span className={`font-black ${colorClass}`}>{p.hp <= 0 ? "DEAD" : `${p.hp}/${START_HP}`}</span>
                                                            </div>
                                                            {p.hp > 0 && (
                                                                <div className="h-1 bg-zinc-900 w-full overflow-hidden rounded-sm">
                                                                    <div className={`h-full transition-all duration-500 ${getHPBarColorClass(p.hp)}`} style={{ width: `${Math.min(100, (p.hp / START_HP) * 100)}%` }}></div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )
                                ) : (
                                    <div className="bg-black/80 p-3 matrix-border text-center">
                                        <p className="text-[10px] text-green-400 uppercase font-mono tracking-widest">SOLO TRENINGSMODUS [{playerHP} HP]</p>
                                    </div>
                                )}

                                <div className="bg-black/85 p-6 sm:p-10 matrix-border text-center relative">
                                    {playerHP <= 0 ? (
                                        <div className="py-12 space-y-2 animate-pulse text-red-500">
                                            <h2 className="text-3xl font-black italic tracking-wide">NODE_ELIMINATED</h2>
                                        </div>
                                    ) : (
                                        <>
                                            <p className="text-[10px] uppercase text-green-500/40 font-mono tracking-widest mb-1">Oversett / Finn synonym:</p>
                                            <h2 className="text-3xl sm:text-4xl font-bold mb-4 text-white uppercase tracking-tight">{gameState.currentGlose.q}</h2>
                                            
                                            <div className="flex flex-col items-center justify-center min-h-[40px] mb-6">
                                                {showHint ? (
                                                    <div className="text-xs text-yellow-500 font-mono tracking-widest bg-yellow-950/20 border border-yellow-900/30 px-3 py-1.5 rounded animate-pulse">
                                                        DEKRYPTERT: {(() => {
                                                            const primary = gameState.currentGlose.a.split(/[/,;]/)[0].trim();
                                                            return primary[0].toUpperCase() + " " + "_ ".repeat(primary.length - 1).trim() + ` (${primary.length} tegn)`;
                                                        })()}
                                                    </div>
                                                ) : (
                                                    <button 
                                                        type="button" 
                                                        onClick={() => setShowHint(true)} 
                                                        className="text-[10px] text-yellow-500/60 border border-yellow-900/30 px-3 py-1.5 hover:bg-yellow-950/40 hover:text-yellow-400 transition-all duration-200 uppercase rounded font-mono"
                                                    >
                                                        [ Dekrypter Glose-Hint ]
                                                    </button>
                                                )}
                                            </div>

                                            <form onSubmit={checkAnswer}>
                                                <input 
                                                    className="w-full bg-transparent text-2xl sm:text-3xl text-center p-2 border-b-2 border-green-900 focus:border-white transition-colors" 
                                                    value={gameState.input} 
                                                    onChange={e => setGameState(p => ({...p, input: e.target.value}))} 
                                                    spellCheck="false" 
                                                    autoComplete="off" 
                                                    placeholder="SKRIV SVAR HER..."
                                                />
                                            </form>
                                        </>
                                    )}
                                    {gameState.feedback && (
                                        <div className="absolute inset-0 bg-black/90 flex items-center justify-center z-20">
                                            <p className={`text-3xl font-black tracking-tighter ${gameState.feedback.includes('✓') ? 'text-green-400' : 'text-red-500'}`}>{gameState.feedback}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'result' && (
                            <div className="bg-black/95 p-12 matrix-border text-center space-y-8">
                                <h2 className="result-text font-black italic text-green-400 animate-pulse">
                                    {playerHP > 0 ? 'MISSION_ACCOMPLISHED' : 'SYSTEM_FAILURE'}
                                </h2>
                                {isMultiplayer && gameMode === 'royale' && (
                                    <p className="text-yellow-500 font-mono font-bold mt-2">WINNER: {getRoyaleWinner()}</p>
                                )}
                                <button onClick={exitGame} className="btn-matrix w-full p-5 font-bold text-xl">Return to Base</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render((<App />));
    </script>

    <a href="index.html" style="position: fixed !important; top: 16px !important; left: 16px !important; z-index: 99999 !important;" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900/80 hover:bg-slate-800 text-white rounded-xl backdrop-blur-md border border-white/20 shadow-2xl transition-all font-sans text-xs font-semibold cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Tilbake til Lærerverktøy</span>
    </a>
</body>
</html>
