<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norsk - Min Skoleportal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        
        <!-- Tilbake-knapp til hovedportalen -->
        <a href="../index.html" class="inline-flex items-center text-sm font-semibold text-slate-600 hover:text-emerald-600 transition mb-6 group">
            <i class="fa-solid fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i> Tilbake til hovedmenyen
        </a>

        <!-- Header -->
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Norsk</h1>
            <p class="text-slate-600 mt-1">Interaktive spill, visualiseringer og treningsverktøy for norskfaget</p>
        </header>

        <!-- Grid med norskverktøy -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- Eksempel på et verktøy (f.eks. Gangedrill) -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                <div>
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">Vokabulær</h2>
                    <p class="text-slate-500 text-sm mb-4">Øve ordforråd.</p>
                </div>
                <a href="vokabular.html" class="inline-flex items-center justify-center w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition">
                    Start Spill <i class="fa-solid fa-play ml-2 text-xs"></i>
                </a>
            </div>

           <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                <div>
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">Nynorsk invasjon</h2>
                    <p class="text-slate-500 text-sm mb-4">Spill mot en medelev.</p>
                </div>
                <a href="invasjon.html" class="inline-flex items-center justify-center w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition">
                    Start Spill <i class="fa-solid fa-play ml-2 text-xs"></i>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
