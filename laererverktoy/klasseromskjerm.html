    .widget {
      position: absolute;
      min-width: 220px;
      min-height: 180px;
      touch-action: none;
      user-select: none;
      transition: box-shadow 0.2s;
      resize: both;
      overflow: hidden;
    }
    .widget-header {
      cursor: move;
    }
    .widget::-webkit-resizer {
      background-color: rgba(99, 102, 241, 0.4);
      border-top-left-radius: 4px;
    }
    .bg-custom-cover {
      background-size: cover;
      background-position: center;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.8);
    }
    .draggable-student {
      cursor: grab;
    }
    .draggable-student:active {
      cursor: grabbing;
    }
    .group-drop-zone.drag-over {
      border-color: #6366f1;
      background-color: #eef2ff;
    }
    /* Styling for rik tekst i tekstredigeringen */
    .rich-editor {
      line-height: 1.45;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .rich-editor * {
      line-height: 1.45;
    }
    .rich-editor p,
    .rich-editor div {
      margin-bottom: 0.2em;
    }
    [contenteditable] ul {
      list-style-type: disc;
      padding-left: 1.5em;
      margin-top: 0.3em;
      margin-bottom: 0.3em;
    }
    [contenteditable] ol {
      list-style-type: decimal;
      padding-left: 1.5em;
      margin-top: 0.3em;
      margin-bottom: 0.3em;
    }
    [contenteditable] li {
      margin-bottom: 0.15em;
    }
    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #94a3b8;
      cursor: text;
    }
    .widget [contenteditable] {
      user-select: text;
      -webkit-user-select: text;
    }
    [contenteditable] img {
      max-width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 6px;
    }
    [contenteditable] img.img-selected {
      outline: 3px solid #0ea5e9;
      outline-offset: 2px;

    <svg class="svg-inline--fa fa-arrow-left" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="arrow-left" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" data-fa-i2svg=""><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"></path></svg><!-- <i class="fa-solid fa-arrow-left"></i> Font Awesome fontawesome.com -->
    <span>Tilbake til Lærerverktøy</span>

  <script>
    let highestZIndex = 100;
    const activeWidgets = new Map();

    let globalSavedLists = {
      "Eksempel 5A": "Kari, Ola, Per, Anne, Sofie, Lukas, Jonas, Nora, Henrik, Emil, Ida, Magnus"
    };

    function getSavedLists() {
      try {
        const local = JSON.parse(localStorage.getItem('klasserom_navnelister'));
        if (local && Object.keys(local).length > 0) {
          return {...globalSavedLists, ...local };
        }
      } catch (e) {}
      return globalSavedLists;
    }

    function saveNamedList(name, content) {
      if (!name) return;
      globalSavedLists[name] = content;
      try {
        localStorage.setItem('klasserom_navnelister', JSON.stringify(globalSavedLists));
      } catch (e) {}
      updateAllListDropdowns();
    }

    function deleteNamedList(name) {
      if (!name) return;
      delete globalSavedLists[name];
      try {
        localStorage.setItem('klasserom_navnelister', JSON.stringify(globalSavedLists));
      } catch (e) {}
      updateAllListDropdowns();
    }

    function updateAllListDropdowns() {
      const lists = getSavedLists();
      const selects = document.querySelectorAll('.class-list-select');
      selects.forEach(select => {
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- Velg lagret liste --</option>';
        Object.keys(lists).forEach(listName => {
          const opt = document.createElement('option');
          opt.value = listName;
          opt.innerText = listName;
          select.appendChild(opt);
        });
        select.value = currentVal;
      });
    }

    function saveLayoutState() {
      const layout = [];
      activeWidgets.forEach((widget, id) => {
        layout.push({
          id: id,
          type: widget.dataset.type,
          top: widget.style.top,
          left: widget.style.left,
          width: widget.style.width,
          height: widget.style.height,
          zIndex: widget.style.zIndex
        });
      });
      try {
        localStorage.setItem('klasserom_layout', JSON.stringify(layout));
      } catch (e) {}
    }

    function restoreLayoutState() {
      try {
        const saved = localStorage.getItem('klasserom_layout');
        if (saved) {
          const layout = JSON.parse(saved);
          layout.forEach(item => {
            createWidget(item.type, item);
          });
        }
        const savedBg = localStorage.getItem('klasserom_bg');
        if (savedBg) {
          applyBackground(savedBg);
        }
      } catch (e) {}
    }

    function updateWelcomeMsg() {
      const welcome = document.getElementById('welcome-msg');
      if (!welcome) return;
      if (activeWidgets.size > 0) {
        welcome.classList.add('opacity-0');
      } else {
        welcome.classList.remove('opacity-0');
      }
    }

    function createWidgetFrame(id, title, iconClass, type, savedConfig = null) {
      const workspace = document.getElementById('workspace');
      const widget = document.createElement('div');
      widget.id = id;
      widget.dataset.type = type;
      widget.className = 'widget bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-white/60 flex flex-col overflow-hidden';

      if (savedConfig) {
        widget.style.left = savedConfig.left;
        widget.style.top = savedConfig.top;
        widget.style.width = savedConfig.width;
        widget.style.height = savedConfig.height;
        widget.style.zIndex = savedConfig.zIndex || ++highestZIndex;
        if (parseInt(savedConfig.zIndex) > highestZIndex) highestZIndex = parseInt(savedConfig.zIndex);
      } else {
        const randomX = Math.max(20, Math.floor(Math.random() * (window.innerWidth - 420)));
        const randomY = Math.max(20, Math.floor(Math.random() * (window.innerHeight - 420)));
        widget.style.left = `${randomX}px`;
        widget.style.top = `${randomY}px`;
        widget.style.width = '340px';
        widget.style.height = 'auto';
        widget.style.zIndex = ++highestZIndex;
      }

      const header = document.createElement('div');
      header.className = 'widget-header px-4 py-3 bg-slate-100/80 border-b border-slate-200/60 flex items-center justify-between cursor-move select-none';
      header.innerHTML = `
        <div class="flex items-center gap-2 font-semibold text-slate-700 text-sm">
          <i class="${iconClass}"></i>
          <span>${title}</span>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="closeWidget('${id}')" class="w-6 h-6 rounded-full hover:bg-red-100 text-slate-400 hover:text-red-600 flex items-center justify-center transition">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>
      `;

      const body = document.createElement('div');
      body.className = 'widget-body p-4 flex-1 flex flex-col overflow-auto';

      widget.appendChild(header);
      widget.appendChild(body);
      workspace.appendChild(widget);

      makeDraggable(widget, header);

      widget.addEventListener('mousedown', () => {
        widget.style.zIndex = ++highestZIndex;
        saveLayoutState();
      });

      const resizeObserver = new ResizeObserver(() => {
        saveLayoutState();
      });
      resizeObserver.observe(widget);
      widget._resizeObserver = resizeObserver;

      activeWidgets.set(id, widget);
      updateWelcomeMsg();
      saveLayoutState();

      return body;
    }

    function closeWidget(id) {
      const widget = document.getElementById(id);
      if (widget) {
        if (widget._resizeObserver) widget._resizeObserver.disconnect();
        if (typeof widget._cleanup === 'function') {
          try { widget._cleanup(); } catch (e) {}
        }
        widget.remove();
        activeWidgets.delete(id);
        try {
          localStorage.removeItem('klasserom_img_' + id);
          localStorage.removeItem('tekstboksContent_' + id);
          if (id === 'widget-tekstboks') localStorage.removeItem('tekstboksContent');
        } catch (e) {}
        updateWelcomeMsg();
        saveLayoutState();
      }
    }

    function clearAllWidgets() {
      activeWidgets.forEach((_, id) => closeWidget(id));
      localStorage.removeItem('klasserom_layout');
    }

    function toggleWidget(id) {
      if (activeWidgets.has(id)) {
        closeWidget(id);
      } else {
        if (id === 'widget-dagsplan' || id === 'dagsplan') createWidget('dagsplan');
        else if (id === 'widget-tekstboks' || id === 'tekstboks') createWidget('tekstboks');
        else {
          const el = document.getElementById(id);
          if (el) el.classList.toggle('hidden');
        }
      }
    }

    function makeDraggable(element, handle) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      handle.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        if (e.target.closest('.draggable-student') || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.isContentEditable) return;
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
        element.style.zIndex = ++highestZIndex;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        saveLayoutState();
      }
    }

    function createWidget(type, savedConfig = null, opts = {}) {
      const id = savedConfig ? savedConfig.id : (type === 'dagsplan' ? 'widget-dagsplan' : (type === 'tekstboks' || type === 'image') ? newWidgetId() : 'widget-' + Date.now());
      if (activeWidgets.has(id)) {
        const w = document.getElementById(id);
        if (w) w.style.zIndex = ++highestZIndex;
        return;
      }

      switch (type) {
        case 'clock': initClockWidget(id, savedConfig); break;
        case 'timer': initTimerWidget(id, savedConfig); break;
        case 'traffic': initTrafficWidget(id, savedConfig); break;
        case 'work-symbols': initWorkSymbolsWidget(id, savedConfig); break;
        case 'noise': initNoiseWidget(id, savedConfig); break;

      const editor = document.getElementById(`${wId}-editor`);

    function changeFontSize(wId, size) {
      const editor = document.getElementById(`${wId}-editor`);
      if (!editor) return;
      editor.focus();

      const sel = window.getSelection();
      const hasSelection = sel && sel.rangeCount > 0 && !sel.isCollapsed && editor.contains(sel.anchorNode);

      // Hjelpefunksjon for å erstatte gamle <font>-tagger med <span style="font-size: ...">
      const normalizeFonts = (root, targetSize) => {
        root.querySelectorAll('font[size]').forEach(f => {
          const span = document.createElement('span');
          span.style.fontSize = targetSize;
          span.style.lineHeight = '1.45';
          span.innerHTML = f.innerHTML;
          f.replaceWith(span);
        });
      };

      // Hvis ingenting er markert, oppdater grunnskriftstørrelsen og eventuell eksisterende tekst
      if (!hasSelection) {
        editor.style.fontSize = size;
        editor.style.lineHeight = '1.45';
        if (editor.textContent.trim().length > 0) {
          normalizeFonts(editor, size);
          editor.querySelectorAll('[style*="font-size"]').forEach(el => {
            el.style.fontSize = size;
            el.style.lineHeight = '1.45';
          });
        }
        saveTekstboksContent(wId);
        return;
      }

      // 1. Bruk execCommand for å pakke det markerte området i <font size="7">
      document.execCommand('fontSize', false, '7');

      // 2. Finn alle nyopprettede <font size="7">-elementer
      const fontEls = Array.from(editor.querySelectorAll('font[size="7"]'));
      const newSpans = [];

      fontEls.forEach(el => {
        // Fjern eventuelle indre størrelses-tagger slik at den nye størrelsen ikke overstyres
        el.querySelectorAll('[style*="font-size"]').forEach(inner => {
          inner.style.fontSize = '';
          inner.style.lineHeight = '';
          if (inner.tagName === 'SPAN' && !inner.getAttribute('style') && inner.attributes.length === 0) {
            inner.replaceWith(...inner.childNodes);
          }
        });
        el.querySelectorAll('font[size]').forEach(innerFont => {
          innerFont.removeAttribute('size');
          if (innerFont.attributes.length === 0) {
            innerFont.replaceWith(...innerFont.childNodes);
          }
        });

        const span = document.createElement('span');
        span.style.fontSize = size;
        span.style.lineHeight = '1.45';
        span.innerHTML = el.innerHTML;
        el.replaceWith(span);
        newSpans.push(span);
      });

      // 3. Gjenopprett markeringen rundt de oppdaterte elementene slik at brukeren kan endre størrelse flere ganger på rad
      if (newSpans.length > 0 && sel) {
        try {
          const range = document.createRange();
          range.setStartBefore(newSpans[0]);
          range.setEndAfter(newSpans[newSpans.length - 1]);
          sel.removeAllRanges();
          sel.addRange(range);
        } catch (e) {}
      }

      saveTekstboksContent(wId);
    }

      window.toggleTimer = (wId) => {
        const s = window[`state_${wId}`];
        if (!s) return;
        const btn = document.getElementById(`${wId}-start`);
        if (s.isRunning) {
          clearInterval(s.interval);
          s.isRunning = false;

            btn.innerText = 'Start';
            btn.className = 'flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition';
          }
        } else {

          s.isRunning = true;
          if (btn) {
            btn.innerText = 'Pause';
            btn.className = 'flex-1 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition';
          }
          s.interval = setInterval(() => {
            if (s.timeLeft > 0) {
              s.timeLeft--;
              window.updateTimerDisplay(wId);
            } else {
              clearInterval(s.interval);
              s.isRunning = false;
              if (btn) {
                btn.innerText = 'Start';

            }
          }, 1000);
        }
      };

      window.addTimerSeconds = (wId, secs) => {
        const s = window[`state_${wId}`];
        if (!s) return;
        s.timeLeft += secs;
        window.updateTimerDisplay(wId);
      };

      window.resetTimer = (wId) => {
        const s = window[`state_${wId}`];
        if (!s) return;
        clearInterval(s.interval);
        s.isRunning = false;
        s.timeLeft = 300;
        const btn = document.getElementById(`${wId}-start`);
        if (btn) {
          btn.innerText = 'Start';
          btn.className = 'flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition';
        }
        window.updateTimerDisplay(wId);
      };

      window.updateTimerDisplay(id);
      document.getElementById(id)._cleanup = () => {
        if (state.interval) clearInterval(state.interval);
        delete window[`state_${id}`];
      };
    }

    function initNoiseWidget(id, savedConfig) {
      const container = createWidgetFrame(id, 'Støymåler', 'fa-solid fa-microphone text-emerald-600', 'noise', savedConfig);
      container.innerHTML = `
        <div class="flex flex-col items-center my-auto w-full">
          <div class="w-full h-6 bg-slate-200 rounded-full overflow-hidden p-1 border border-slate-300 mb-3">
            <div id="${id}-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-75 w-0"></div>
          </div>
          <div id="${id}-status" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 text-center">Trykk på Start for å aktivere mikrofon</div>
          <div id="${id}-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-2.5 mb-3 text-center w-full font-medium leading-relaxed"></div>
          <button id="${id}-btn" onclick="toggleMic('${id}')" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition">Start Måling</button>
        </div>
      `;
      let audioCtx, analyser, microphone, stream;

      window.toggleMic = async (wId) => {
        const btn = document.getElementById(`${wId}-btn`);
        const status = document.getElementById(`${wId}-status`);
        const bar = document.getElementById(`${wId}-bar`);
        const errorBox = document.getElementById(`${wId}-error`);
        if (errorBox) errorBox.classList.add('hidden');

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
          stream = null; audioCtx = null;
          if (btn) {
            btn.innerText = "Start Måling";
            btn.className = "px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition";
          }
          if (status) status.innerText = "Måling stoppet";
          if (bar) bar.style.width = "0%";
          return;
        }

        const getMedia = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
          ? (c) => navigator.mediaDevices.getUserMedia(c)
          : (c) => new Promise((res, rej) => {
              const legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
              if (!legacy) rej(new Error("NOT_SUPPORTED"));
              else legacy.call(navigator, c, res, rej);
            });

        try {
          stream = await getMedia({ audio: true, video: false });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          microphone = audioCtx.createMediaStreamSource(stream);
          microphone.connect(analyser);
          analyser.fftSize = 256;

          if (btn) {
            btn.innerText = "Stopp Måling";
            btn.className = "px-4 py-2 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition";
          }
          if (status) {
            status.innerText = "Måler støynivå...";
            status.className = "text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 text-center";
          }

          const dataArray = new Uint8Array(analyser.frequencyBinCount);
          function checkVolume() {
            if (!stream) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let vol = Math.min(100, Math.round((avg / 128) * 100));
            if (bar) bar.style.width = vol + "%";

            if (vol > 70) {
              if (bar) bar.className = "h-full bg-red-500 rounded-full transition-all duration-75";
              if (status) {
                status.innerText = "For høyt støynivå!";
                status.className = "text-xs font-bold text-red-600 uppercase tracking-wider mb-2 text-center animate-pulse";
              }
            } else if (vol > 40) {
              if (bar) bar.className = "h-full bg-amber-400 rounded-full transition-all duration-75";
              if (status) {
                status.innerText = "Moderat støynivå";
                status.className = "text-xs font-bold text-amber-600 uppercase tracking-wider mb-2 text-center";
              }
            } else {
              if (bar) bar.className = "h-full bg-emerald-500 rounded-full transition-all duration-75";
              if (status) {
                status.innerText = "Fint støynivå";
                status.className = "text-xs font-bold text-emerald-600 uppercase tracking-wider mb-2 text-center";
              }
            }
            requestAnimationFrame(checkVolume);
          }
          checkVolume();
        } catch (err) {
          let msg = "";
          if (err.message === "NOT_SUPPORTED" || (typeof window.isSecureContext !== 'undefined' && !window.isSecureContext)) {
            msg = "Mikrofontilgang krever HTTPS. Nettleseren sperrer mikrofonen over usikrede tilkoblinger.";
          } else if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError" || err.name === "SecurityError") {
            msg = "Blokkerer mikrofonen i innbygde elementer. Åpne siden direkte for å bruke støymåleren.";
          } else {
            msg = "Kunne ikke starte støymåleren: " + (err.message || err.name || "Ukjent feil");
          }
          if (errorBox) {
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
          }
          if (status) status.innerText = "Måling mislyktes";
        }
      };

      document.getElementById(id)._cleanup = () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
      };
    }

        <div class="flex flex-col h-full gap-2">
          <div class="flex gap-2 items-center justify-between bg-slate-100 p-2 rounded-xl">
            <div class="flex gap-1">
              <button onclick="setPenColor('${id}', '#000000')" class="w-6 h-6 rounded-full bg-black border border-slate-300"></button>
              <button onclick="setPenColor('${id}', '#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-slate-300"></button>
              <button onclick="setPenColor('${id}', '#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-slate-300"></button>
              <button onclick="setPenColor('${id}', '#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border border-slate-300"></button>
            </div>
            <button onclick="clearCanvas('${id}')" class="text-xs text-red-600 font-bold hover:underline">Tøm brett</button>
          </div>
          <div class="flex-1 w-full h-full relative overflow-hidden rounded-xl border border-slate-200 bg-white">
            <canvas id="${id}-canvas" class="w-full h-full cursor-crosshair block"></canvas>
          </div>
        </div>
      `;

      setTimeout(() => {
        const canvas = document.getElementById(`${id}-canvas`);
        if (!canvas) return;
        let isDrawing = false, currentColor = '#000000';

        function fitCanvasToParent() {
          const rect = canvas.parentElement.getBoundingClientRect();
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(canvas, 0, 0);
          canvas.width = rect.width; canvas.height = rect.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempCanvas, 0, 0);
          ctx.lineWidth = 3; ctx.lineCap = 'round';
        }

        fitCanvasToParent();
        const resizeObs = new ResizeObserver(() => fitCanvasToParent());
        resizeObs.observe(canvas.parentElement);

        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 3; ctx.lineCap = 'round';

        window.setPenColor = (wId, color) => { currentColor = color; };
        window.clearCanvas = (wId) => {
          const c = document.getElementById(`${wId}-canvas`);
          if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
        };

        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
          if (!isDrawing) return;
          const rect = canvas.getBoundingClientRect();
          const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
          const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
          ctx.strokeStyle = currentColor;
          ctx.lineTo(x, y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw);

        const el = document.getElementById(id);
        if (el) el._cleanup = () => resizeObs.disconnect();
      }, 100);
    }

        row.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden">
            <span class="bg-amber-100 text-amber-800 font-mono font-bold px-2 py-0.5 rounded-md flex-shrink-0">${item.tid}</span>
            <span class="text-slate-700 font-medium truncate">${item.tekst}</span>
          </div>
          <button onclick="removeDagsplanItem(${index})" class="text-slate-400 hover:text-rose-600 p-1 transition flex-shrink-0">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        listEl.appendChild(row);
      });
      try {
        localStorage.setItem('dagsplanData', JSON.stringify(dagsplanItems));
      } catch (e) {}
    }

    function addDagsplanItem() {
      const tidInput = document.getElementById('dagsplan-tid');
      const tekstInput = document.getElementById('dagsplan-tekst');
      if (!tekstInput || !tekstInput.value.trim()) return;
      dagsplanItems.push({
        tid: tidInput.value.trim() || '--:--',
        tekst: tekstInput.value.trim()
      });
      tidInput.value = '';
      tekstInput.value = '';
      renderDagsplan();
    }

    function removeDagsplanItem(index) {
      dagsplanItems.splice(index, 1);
      renderDagsplan();
    }

    function newWidgetId() { return 'widget-' + Date.now() + '-' + Math.floor(Math.random() * 100000); }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-2xl';
      t.style.zIndex = 99999;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    function saveTekstboksContent(wId = 'widget-tekstboks') {
      const editor = document.getElementById(`${wId}-editor`) || document.getElementById('tekstboks-input');
      if (!editor) return;
      let content;
      if (editor.isContentEditable) {
        const c = editor.cloneNode(true);
        c.querySelectorAll('img.img-selected').forEach(i => i.classList.remove('img-selected'));
        content = c.innerHTML;
      } else content = editor.value;
      try { localStorage.setItem(`tekstboksContent_${wId}`, content); }
      catch (e) { toast('Lagringsplassen er full – bildene blir ikke husket. Bruk færre eller mindre bilder.'); }
    }

    function loadTekstboksContent(wId = 'widget-tekstboks') {
      let saved = null;
      try {
        saved = localStorage.getItem(`tekstboksContent_${wId}`);
        if (saved === null && wId === 'widget-tekstboks') saved = localStorage.getItem('tekstboksContent');
      } catch (e) {}
      const editor = document.getElementById(`${wId}-editor`);
      const oldInput = document.getElementById('tekstboks-input');
      if (saved !== null) {
        if (editor) {
          editor.innerHTML = saved;
          editor.querySelectorAll('[style*="font-size"]').forEach(el => {
            if (!el.style.lineHeight) el.style.lineHeight = '1.45';
          });
        }
        else if (oldInput && wId === 'widget-tekstboks') oldInput.value = saved;
      }
    }

    // --- BILDER ---
    function readImageFile(file, maxDim = 1200) {
      return new Promise((res, rej) => {
        if (!file || !file.type.startsWith('image/')) return rej();
        const fr = new FileReader();
        fr.onerror = rej;
        fr.onload = () => {
          const img = new Image();
          img.onerror = rej;
          img.onload = () => {
            const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            const x = cv.getContext('2d');
            const keepAlpha = file.type === 'image/png' || file.type === 'image/webp';
            if (!keepAlpha) { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
            x.drawImage(img, 0, 0, w, h);
            res(keepAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82));
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

    function pickImageFile(cb) {
      const i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*';
      i.onchange = () => { if (i.files[0]) cb(i.files[0]); };
      i.click();
    }

    function setupTextImages(id) {
      const ed = document.getElementById(`${id}-editor`);
      if (!ed) return;
      const remember = () => {
        const sel = getSelection();
        if (sel.rangeCount && ed.contains(sel.anchorNode)) ed._range = sel.getRangeAt(0).cloneRange();
      };
      ['keyup', 'mouseup', 'blur'].forEach(ev => ed.addEventListener(ev, remember));
      ed.addEventListener('click', e => selectTextImage(id, e.target.tagName === 'IMG' ? e.target : null));
      ed.addEventListener('paste', e => {
        const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
        if (f) { e.preventDefault(); addImageFileToText(id, f); }
      });
      ed.addEventListener('dragover', e => {
        if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault();
      });
      ed.addEventListener('drop', e => {
        const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
        if (!f) return;
        e.preventDefault(); e.stopPropagation();
        const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
        if (r && ed.contains(r.startContainer)) ed._range = r;
        addImageFileToText(id, f);
      });
    }

    function selectTextImage(id, img) {
      const ed = document.getElementById(`${id}-editor`), tools = document.getElementById(`${id}-imgtools`);
      if (!ed || !tools) return;
      ed.querySelectorAll('img.img-selected').forEach(i => i.classList.remove('img-selected'));
      ed._img = img;
      if (img) { img.classList.add('img-selected'); tools.classList.remove('hidden'); tools.classList.add('flex'); }
      else { tools.classList.add('hidden'); tools.classList.remove('flex'); }
    }

    function insertImageInText(id) { pickImageFile(f => addImageFileToText(id, f)); }

    function addImageFileToText(id, file) {
      readImageFile(file, 1200).then(src => {
        const ed = document.getElementById(`${id}-editor`);
        if (!ed) return;
        const img = document.createElement('img');
        img.src = src;
        img.style.cssText = 'width:50%;display:block;margin:6px auto;';
        ed.focus();
        const sel = getSelection();
        let r = ed._range;
        if (!r || !ed.contains(r.startContainer)) { r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); }
        sel.removeAllRanges(); sel.addRange(r);
        r.deleteContents(); r.insertNode(img);
        r.setStartAfter(img); r.collapse(true);
        sel.removeAllRanges(); sel.addRange(r);
        ed._range = r.cloneRange();
        selectTextImage(id, img);
        saveTekstboksContent(id);
      }).catch(() => toast('Kunne ikke lese bildet.'));
    }

    function imgAct(id, act) {
      const ed = document.getElementById(`${id}-editor`), img = ed && ed._img;
      if (!img) return;
      if (act === 'del') { img.remove(); selectTextImage(id, null); }
      else if (act === 'plus' || act === 'minus') {
        const steps = [10, 15, 25, 35, 50, 65, 80, 100];
        const cur = parseFloat(img.style.width) || 50;
        let i = steps.findIndex(v => v >= cur);
        if (i < 0) i = steps.length - 1;
        i = Math.max(0, Math.min(steps.length - 1, i + (act === 'plus' ? 1 : -1)));
        img.style.width = steps[i] + '%';
      } else {
        const w = img.style.width || '50%';
        const m = {
          left: 'float:left;margin:4px 12px 6px 0;',
          right: 'float:right;margin:4px 0 6px 12px;',
          center: 'display:block;float:none;margin:6px auto;'
        }[act];
        img.style.cssText = 'width:' + w + ';' + m;
      }
      saveTekstboksContent(id);
    }

    function initImageWidget(id, savedConfig, opts = {}) {
      const c = createWidgetFrame(id, 'Bilde', 'fa-solid fa-photo-film text-pink-500', 'image', savedConfig);
      const el = document.getElementById(id);
      if (!savedConfig && el) { el.style.width = '420px'; el.style.height = '340px'; }
      c.classList.remove('p-4'); c.classList.add('p-2');
      c.innerHTML = `<div class="relative flex-1 min-h-0 flex items-center justify-center"></div>`;
      const box = c.firstElementChild;

      const render = (src) => {
        if (!src) {
          box.innerHTML = `<div class="text-center text-slate-500 text-xs p-3 border-2 border-dashed border-slate-300 rounded-xl w-full h-full flex flex-col items-center justify-center gap-2">
            <i class="fa-regular fa-image text-4xl text-slate-300"></i>
            <p>Dra et bilde hit, eller lim inn med Ctrl+V</p>
            <div class="flex gap-2">
              <button data-a="file" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-white rounded-lg font-semibold">Velg bilde</button>
              <button data-a="url" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg font-semibold">Fra nettadresse</button>
            </div></div>`;
        } else {
          box.innerHTML = `<img class="w-full h-full object-contain rounded-lg pointer-events-none" draggable="false">
            <div class="absolute top-1 right-1 flex gap-1">
              <button data-a="file" class="w-7 h-7 rounded-lg bg-white/80 hover:bg-white shadow text-slate-700" title="Bytt bilde"><i class="fa-solid fa-arrow-up-from-bracket text-xs"></i></button>
              <button data-a="clear" class="w-7 h-7 rounded-lg bg-white/80 hover:bg-red-50 shadow text-red-600" title="Fjern bilde"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>`;
          box.querySelector('img').src = src;
        }
      };

      const setSrc = (src, fit) => {
        render(src);
        try {
          if (src) localStorage.setItem('klasserom_img_' + id, src);
          else localStorage.removeItem('klasserom_img_' + id);
        } catch (e) { toast('Bildet er for stort til å lagres og forsvinner når siden lastes på nytt.'); }
        if (src && fit) {
          const im = box.querySelector('img');
          im.onload = () => {
            const a = im.naturalWidth / im.naturalHeight || 1;
            const w = Math.min(460, window.innerWidth - 60);
            el.style.width = w + 'px';
            el.style.height = Math.min(window.innerHeight * 0.75, w / a + 64) + 'px';
            saveLayoutState();
          };
        }
      };

      const fromFile = f => readImageFile(f, 1600).then(sv => setSrc(sv, true)).catch(() => toast('Kunne ikke lese bildet.'));

      box.addEventListener('click', e => {
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (a === 'file') pickImageFile(fromFile);
        else if (a === 'url') { const u = prompt('Lim inn adressen til bildet:'); if (u && u.trim()) setSrc(u.trim(), true); }
        else if (a === 'clear') setSrc(null);
      });
      el.addEventListener('dragover', e => e.preventDefault());
      el.addEventListener('drop', e => {
        const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
        if (f) { e.preventDefault(); fromFile(f); }
      });
      el._setImageFile = fromFile;

      let saved = null;
      try { saved = localStorage.getItem('klasserom_img_' + id); } catch (e) {}
      render(saved);
      if (opts.file) fromFile(opts.file);
      else if (!saved && !savedConfig) pickImageFile(fromFile);
    }

    // Lim inn bilde utenfor tekstfelt: fyll tomt bildeverktøy, ellers lag nytt
    document.addEventListener('paste', e => {
      const t = e.target;
      if (t.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName)) return;
      const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
      if (!f) return;
      e.preventDefault();
      const empty = [...activeWidgets.values()]
        .filter(w => w.dataset.type === 'image' && !w.querySelector('img'))
        .sort((x, y) => y.style.zIndex - x.style.zIndex)[0];
      if (empty) empty._setImageFile(f); else createWidget('image', null, { file: f });
    });

    // --- OPPSTART ---
    window.addEventListener('DOMContentLoaded', () => {
      restoreLayoutState();
      loadTekstboksContent();
    });
  </script>

</body></html>
