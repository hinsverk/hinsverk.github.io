<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setningspuslespill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @media print {
            @page {
                margin: 1.5cm;
                size: A4;
            }
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #print-area {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                background-color: transparent !important;
            }
            .word-card {
                border: 2px dashed #334155 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .sentence-group {
                page-break-inside: avoid;
                break-inside: avoid;
                border-bottom: 1px solid #cbd5e1;
                padding-bottom: 1.5rem;
                margin-bottom: 1.5rem;
            }
            .sentence-group:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Kontrollpanel (skjules ved utskrift) -->
    <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-6 sm:px-6">
            <div class="mb-3">
                <a href="../index.html" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition">
                    <span aria-hidden="true">&larr;</span> Tilbake
                </a>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mb-4">Setningspuslespill</h1>
            
            <div class="space-y-4">
                <!-- Valg av modus: Ord, Setning eller Avsnitt -->
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-sm font-medium text-slate-700 mr-1">Del opp i:</span>
                    <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200" role="group">
                        <button type="button" id="mode-words" class="rounded-lg bg-white px-4 py-1.5 text-sm font-semibold text-slate-900 shadow-sm transition cursor-pointer">
                            Ord
                        </button>
                        <button type="button" id="mode-sentences" class="rounded-lg px-4 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer">
                            Setning
                        </button>
                        <button type="button" id="mode-paragraphs" class="rounded-lg px-4 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer">
                            Avsnitt
                        </button>
                    </div>
                </div>

                <div>
                    <label id="input-label" for="sentence-input" class="block text-sm font-medium text-slate-700 mb-1">
                        Skriv inn én eller flere setninger (én per linje)
                    </label>
                    <textarea 
                        id="sentence-input" 
                        rows="4" 
                        class="w-full rounded-xl border border-slate-300 bg-slate-50 p-3.5 text-lg text-slate-900 focus:border-slate-500 focus:bg-white focus:outline-none transition"
                        placeholder="Katten sitter på taket."></textarea>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-3">
                        <button 
                            id="generate-btn" 
                            class="rounded-xl bg-slate-800 px-6 py-3 text-base font-semibold text-white hover:bg-slate-700 active:bg-slate-900 transition cursor-pointer">
                            Lag puslespill
                        </button>
                        <button 
                            id="clear-btn" 
                            class="rounded-xl border border-slate-300 bg-white px-4 py-3 text-base font-medium text-slate-700 hover:bg-slate-100 transition cursor-pointer">
                            Tøm
                        </button>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <label for="font-size" class="text-sm font-medium text-slate-700">Skriftstørrelse:</label>
                            <select id="font-size" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 focus:outline-none">
                                <option value="normal">Normal</option>
                                <option value="large" selected>Stor</option>
                                <option value="xlarge">Ekstra stor</option>
                            </select>
                        </div>

                        <button 
                            id="print-btn" 
                            class="hidden rounded-xl bg-emerald-600 px-6 py-3 text-base font-semibold text-white hover:bg-emerald-700 active:bg-emerald-800 transition cursor-pointer">
                            Skriv ut
                        </button>
                    </div>
                </div>

                <!-- Melding ved tom inntasting -->
                <div id="message-box" class="hidden rounded-lg bg-amber-50 border border-amber-200 px-4 py-2.5 text-sm text-amber-800">
                    Skriv inn tekst først.
                </div>
            </div>
        </div>
    </header>

    <!-- Utskriftsområde / Forhåndsvisning -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 sm:px-6">
        <div id="print-area" class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-10 min-h-[400px] shadow-sm">
            <div id="empty-state" class="h-full flex items-center justify-center py-20 text-slate-400 text-lg">
                Utklippskortene vises her
            </div>
            <div id="cards-container" class="space-y-8"></div>
        </div>
    </main>

    <script>
        const sentenceInput = document.getElementById('sentence-input');
        const inputLabel = document.getElementById('input-label');
        const modeWordsBtn = document.getElementById('mode-words');
        const modeSentencesBtn = document.getElementById('mode-sentences');
        const modeParagraphsBtn = document.getElementById('mode-paragraphs');
        const generateBtn = document.getElementById('generate-btn');
        const clearBtn = document.getElementById('clear-btn');
        const printBtn = document.getElementById('print-btn');
        const fontSizeSelect = document.getElementById('font-size');
        const cardsContainer = document.getElementById('cards-container');
        const emptyState = document.getElementById('empty-state');
        const messageBox = document.getElementById('message-box');

        let currentMode = 'words'; // 'words', 'sentences' eller 'paragraphs'

        const activeBtnClass = 'rounded-lg bg-white px-4 py-1.5 text-sm font-semibold text-slate-900 shadow-sm transition cursor-pointer';
        const inactiveBtnClass = 'rounded-lg px-4 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900 transition cursor-pointer';

        // Skift mellom ord, setning og avsnitt
        function setMode(mode) {
            currentMode = mode;

            modeWordsBtn.className = mode === 'words' ? activeBtnClass : inactiveBtnClass;
            modeSentencesBtn.className = mode === 'sentences' ? activeBtnClass : inactiveBtnClass;
            modeParagraphsBtn.className = mode === 'paragraphs' ? activeBtnClass : inactiveBtnClass;

            if (mode === 'words') {
                inputLabel.textContent = 'Skriv inn én eller flere setninger (én per linje)';
                sentenceInput.placeholder = 'Katten sitter på taket.';
            } else if (mode === 'sentences') {
                inputLabel.textContent = 'Lim inn eller skriv en tekst (deles automatisk ved punktum, utropstegn og spørsmålstegn)';
                sentenceInput.placeholder = 'Katten sitter på taket. Hunden sover i kurven! Hva gjør fuglen?';
            } else {
                inputLabel.textContent = 'Lim inn eller skriv en tekst (nytt avsnitt ved linjeskift)';
                sentenceInput.placeholder = 'Første avsnitt skrives her.\n\nAndre avsnitt på ny linje.';
            }

            if (cardsContainer.children.length > 0) {
                generatePuzzle();
            }
        }

        modeWordsBtn.addEventListener('click', () => setMode('words'));
        modeSentencesBtn.addEventListener('click', () => setMode('sentences'));
        modeParagraphsBtn.addEventListener('click', () => setMode('paragraphs'));

        // Hent og del opp tekst basert på valgt modus
        function generatePuzzle() {
            const rawText = sentenceInput.value.trim();
            
            if (!rawText) {
                messageBox.classList.remove('hidden');
                return;
            }
            
            messageBox.classList.add('hidden');
            emptyState.classList.add('hidden');
            printBtn.classList.remove('hidden');
            cardsContainer.innerHTML = '';

            const sizeSetting = fontSizeSelect.value;

            if (currentMode === 'words') {
                const lines = rawText.split(/\n+/).map(line => line.trim()).filter(line => line.length > 0);
                const wordSizeClass = {
                    normal: 'text-3xl',
                    large: 'text-4xl',
                    xlarge: 'text-5xl'
                }[sizeSetting];

                cardsContainer.className = 'space-y-8';

                lines.forEach((line) => {
                    const words = line.split(/\s+/).filter(word => word.length > 0);

                    const sentenceGroup = document.createElement('div');
                    sentenceGroup.className = 'sentence-group flex flex-wrap gap-4 items-center';

                    words.forEach((word) => {
                        const card = document.createElement('div');
                        card.className = `word-card border-2 border-dashed border-slate-400 rounded-xl px-7 py-5 bg-white text-slate-900 font-semibold tracking-wide select-none ${wordSizeClass}`;
                        card.textContent = word;
                        sentenceGroup.appendChild(card);
                    });

                    cardsContainer.appendChild(sentenceGroup);
                });
            } else if (currentMode === 'sentences') {
                // Del opp i setninger ved skilletegn (. ! ?) eller linjeskift
                const sentences = rawText
                    .replace(/\n+/g, ' ')
                    .match(/[^.!?]+[.!?]+|[^.!?]+$/g)
                    ?.map(s => s.trim())
                    .filter(s => s.length > 0) || [];

                const sentenceSizeClass = {
                    normal: 'text-xl leading-relaxed',
                    large: 'text-2xl leading-relaxed',
                    xlarge: 'text-3xl leading-relaxed'
                }[sizeSetting];

                cardsContainer.className = 'space-y-4';

                sentences.forEach((sentence) => {
                    const card = document.createElement('div');
                    card.className = `word-card border-2 border-dashed border-slate-400 rounded-xl px-7 py-5 bg-white text-slate-900 font-medium select-none w-full ${sentenceSizeClass}`;
                    card.textContent = sentence;
                    cardsContainer.appendChild(card);
                });
            } else {
                const lines = rawText.split(/\n+/).map(line => line.trim()).filter(line => line.length > 0);
                const paragraphSizeClass = {
                    normal: 'text-lg leading-relaxed',
                    large: 'text-xl leading-relaxed',
                    xlarge: 'text-2xl leading-relaxed'
                }[sizeSetting];

                cardsContainer.className = 'space-y-5';

                lines.forEach((paragraph) => {
                    const card = document.createElement('div');
                    card.className = `word-card border-2 border-dashed border-slate-400 rounded-xl px-7 py-6 bg-white text-slate-900 font-normal select-none w-full ${paragraphSizeClass}`;
                    card.textContent = paragraph;
                    cardsContainer.appendChild(card);
                });
            }
        }

        // Oppdater størrelse umiddelbart hvis kort allerede er laget
        fontSizeSelect.addEventListener('change', () => {
            if (cardsContainer.children.length > 0) {
                generatePuzzle();
            }
        });

        // Knapp for å lage puslespill
        generateBtn.addEventListener('click', generatePuzzle);

        // Mulighet for å trykke Ctrl+Enter / Cmd+Enter i tekstfeltet
        sentenceInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                generatePuzzle();
            }
        });

        // Tøm alt
        clearBtn.addEventListener('click', () => {
            sentenceInput.value = '';
            cardsContainer.innerHTML = '';
            emptyState.classList.remove('hidden');
            printBtn.classList.add('hidden');
            messageBox.classList.add('hidden');
            sentenceInput.focus();
        });

        // Skriv ut
        printBtn.addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
