<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lærerverktøy - Min Skoleportal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        
        <a href="../index.html" class="inline-flex items-center text-sm font-semibold text-slate-600 hover:text-indigo-600 transition mb-6 group">
            <i class="fa-solid fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i> Tilbake til hovedmenyen
        </a>

        <header class="mb-10">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Lærerverktøy</h1>
            <p class="text-slate-600 mt-1">Praktiske verktøy for lærere.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                <div>
                    <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-chalkboard-user"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">Klasseromskjerm</h2>
                    <p class="text-slate-500 text-sm mb-4">Interaktiv skjerm med flyttbare widgets: Klokke, timer, navnetrekker, gruppevelger og støymåler.</p>
                </div>
                <a href="klasseromskjerm.html" class="inline-flex items-center justify-center w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition">
                    Start <i class="fa-solid fa-play ml-2 text-xs"></i>
                </a>
            </div>

            <div class="bg-slate-50/60 rounded-2xl p-6 border-2 border-dashed border-slate-200 flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 bg-slate-200 text-slate-400 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-400 mb-2">Stafett</h2>
                    <p class="text-slate-400 text-sm mb-4">Stafettapp for poeng og kåring av vinner.</p>
                </div>
                 <a href="stafett.html" class="inline-flex items-center justify-center w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition">
                    Start <i class="fa-solid fa-play ml-2 text-xs"></i>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
