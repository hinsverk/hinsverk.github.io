<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasse-Konkurranse Oversikt</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome ikoner -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- Applikasjonslogikk (React + JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY_CLASSES = 'klasse_konkurranse_classes';
    const STORAGE_KEY_ACTIVE_ID = 'klasse_konkurranse_active_id';

    const App = () => {
      // App-tilstand for klasser/fag
      const [classes, setClasses] = useState([
        { id: 'default', name: 'Min Klasse', students: [], weeklyResults: [] }
      ]);
      const [activeClassId, setActiveClassId] = useState('default');
      const [newClassName, setNewClassName] = useState('');
      const [showNewClassModal, setShowNewClassModal] = useState(false);

      // Skjema og visningstilstand
      const [newStudentName, setNewStudentName] = useState('');
      const [activeTab, setActiveTab] = useState('summary');

      // Skjema-tilstand for ny uke
      const [currentWeek, setCurrentWeek] = useState(1);
      const [tempWinners, setTempWinners] = useState([{ name: '', points: 10, rank: 1 }]);
      const [error, setError] = useState('');

      // 1. Last inn data fra localStorage ved oppstart
      useEffect(() => {
        try {
          const savedClasses = localStorage.getItem(STORAGE_KEY_CLASSES);
          const savedActiveId = localStorage.getItem(STORAGE_KEY_ACTIVE_ID);

          if (savedClasses) {
            const parsed = JSON.parse(savedClasses);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setClasses(parsed);
              if (savedActiveId && parsed.some(c => c.id === savedActiveId)) {
                setActiveClassId(savedActiveId);
              } else {
                setActiveClassId(parsed[0].id);
              }
            }
          }
        } catch (e) {
          console.error("Feil ved lasting fra localStorage:", e);
        }
      }, []);

      // Hent ut aktiv klasse sin data
      const currentClass = useMemo(() => {
        return classes.find(c => c.id === activeClassId) || classes[0] || { id: 'default', name: 'Klasse', students: [], weeklyResults: [] };
      }, [classes, activeClassId]);

      const students = currentClass.students || [];
      const weeklyResults = currentClass.weeklyResults || [];

      // 2. Funksjon for å lagre til localStorage
      const saveToStorage = (updatedClasses, newActiveId = activeClassId) => {
        try {
          localStorage.setItem(STORAGE_KEY_CLASSES, JSON.stringify(updatedClasses));
          localStorage.setItem(STORAGE_KEY_ACTIVE_ID, newActiveId);
        } catch (e) {
          console.error("Feil ved lagring til localStorage:", e);
          setError("Kunne ikke lagre til nettleseren.");
        }
      };

      // Klasse-handlinger
      const addClass = () => {
        const trimmed = newClassName.trim();
        if (!trimmed) return;
        const newId = 'class_' + Date.now();
        const newClass = {
          id: newId,
          name: trimmed,
          students: [],
          weeklyResults: []
        };
        const updatedClasses = [...classes, newClass];
        setClasses(updatedClasses);
        setActiveClassId(newId);
        setNewClassName('');
        setShowNewClassModal(false);
        saveToStorage(updatedClasses, newId);
      };

      const deleteClass = (idToDelete) => {
        if (classes.length <= 1) {
          setError('Du må ha minst én klasse registrert.');
          return;
        }
        const classToDelete = classes.find(c => c.id === idToDelete);
        if (!confirm(`Er du sikker på at du vil slette klassen "${classToDelete?.name}" og alle resultatene for den?`)) return;
        
        const updatedClasses = classes.filter(c => c.id !== idToDelete);
        const nextActiveId = idToDelete === activeClassId ? updatedClasses[0].id : activeClassId;
        setClasses(updatedClasses);
        setActiveClassId(nextActiveId);
        saveToStorage(updatedClasses, nextActiveId);
      };

      const handleSelectClass = (id) => {
        setActiveClassId(id);
        saveToStorage(classes, id);
      };

      // Elev-handlinger for aktiv klasse
      const addStudent = () => {
        const trimmed = newStudentName.trim();
        if (trimmed && !students.includes(trimmed)) {
          const updatedClasses = classes.map(c => {
            if (c.id === activeClassId) {
              return { ...c, students: [...c.students, trimmed] };
            }
            return c;
          });
          setClasses(updatedClasses);
          setNewStudentName('');
          saveToStorage(updatedClasses);
        }
      };

      const removeStudent = (name) => {
        const updatedClasses = classes.map(c => {
          if (c.id === activeClassId) {
            return { ...c, students: c.students.filter(s => s !== name) };
          }
          return c;
        });
        setClasses(updatedClasses);
        saveToStorage(updatedClasses);
      };

      // Resultat-handlinger for aktiv klasse
      const addWinnerRow = () => {
        const lastRank = tempWinners.length > 0 ? tempWinners[tempWinners.length - 1].rank : 0;
        const nextPoints = Math.max(0, 10 - (tempWinners.length * 2));
        setTempWinners([...tempWinners, { name: '', points: nextPoints, rank: lastRank + 1 }]);
      };

      const removeWinnerRow = (index) => {
        setTempWinners(tempWinners.filter((_, i) => i !== index));
      };

      const updateWinnerRow = (index, field, value) => {
        const updated = [...tempWinners];
        updated[index][field] = field === 'points' || field === 'rank' ? Number(value) : value;
        setTempWinners(updated);
      };

      const addWeeklyResult = () => {
        setError('');
        const validWinners = tempWinners.filter(w => w.name !== '');
        
        if (validWinners.length === 0) {
          setError('Du må legge til minst én elev med navn.');
          return;
        }

        const names = validWinners.map(w => w.name);
        if (new Set(names).size !== names.length) {
          setError('Samme elev kan ikke registreres flere ganger samme uke.');
          return;
        }

        const updatedResults = [...weeklyResults, { 
          week: Number(currentWeek), 
          winners: validWinners 
        }];

        const updatedClasses = classes.map(c => {
          if (c.id === activeClassId) {
            return { ...c, weeklyResults: updatedResults };
          }
          return c;
        });

        setClasses(updatedClasses);
        saveToStorage(updatedClasses);
        
        // Tilbakestill skjema
        setTempWinners([{ name: '', points: 10, rank: 1 }]);
        setCurrentWeek(updatedResults.length + 1);
      };

      // Beregninger for aktiv klasse
      const leaderboard = useMemo(() => {
        const scores = {};
        students.forEach(s => scores[s] = 0);
        
        weeklyResults.forEach(week => {
          week.winners.forEach(winner => {
            if (scores.hasOwnProperty(winner.name)) {
              scores[winner.name] += winner.points;
            }
          });
        });

        return Object.entries(scores)
          .map(([name, score]) => ({ name, score }))
          .sort((a, b) => b.score - a.score);
      }, [students, weeklyResults]);

      const top3 = leaderboard.slice(0, 3);

      // Pall-komponent
      const Podium = () => {
        const displayOrder = [
          top3[1] || { name: '-', score: 0 },
          top3[0] || { name: '-', score: 0 },
          top3[2] || { name: '-', score: 0 }
        ];

        const heights = ['h-32', 'h-48', 'h-24'];
        const colors = ['bg-slate-300', 'bg-yellow-400', 'bg-orange-400'];
        const labels = ['2', '1', '3'];

        return (
          <div className="flex items-end justify-center gap-2 my-8 h-64">
            {displayOrder.map((student, i) => (
              <div key={`podium-${i}`} className="flex flex-col items-center flex-1 max-w-[120px]">
                <div className="mb-2 text-center font-bold truncate w-full text-slate-700 px-1">
                  {student.name}
                </div>
                <div className={`w-full ${heights[i]} ${colors[i]} rounded-t-lg shadow-lg flex flex-col items-center justify-center relative transition-all duration-500`}>
                  <span className="text-4xl font-black text-white opacity-50">{labels[i]}</span>
                  <span className="absolute bottom-2 font-bold text-slate-800">{student.score} p</span>
                </div>
              </div>
            ))}
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans p-4 md:p-8 relative">
          {/* TILBAKE-KNAPP */}
          <a 
            href="index.html" 
            className="inline-flex items-center gap-2 px-4 py-2 bg-slate-900/80 hover:bg-slate-800 text-white rounded-xl backdrop-blur-md border border-white/20 shadow-lg transition-all text-xs font-semibold mb-6 sm:fixed sm:top-4 sm:left-4 sm:z-50 sm:mb-0 cursor-pointer"
          >
            <i className="fa-solid fa-arrow-left"></i>
            <span>Tilbake til Lærerverktøy</span>
          </a>

          <div className="max-w-4xl mx-auto">
            <header className="flex items-center justify-between mb-6">
              <div>
                <h1 className="text-3xl font-bold text-indigo-900">Klasse-Konkurranse</h1>
                <div className="flex items-center gap-2 text-slate-500 text-sm mt-1">
                  <span className="text-emerald-600 font-medium flex items-center gap-1">
                    <i className="fa-solid fa-hard-drive text-xs"></i> Lagret lokalt (localStorage)
                  </span>
                </div>
              </div>
              <div className="bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
                <i className="fa-solid fa-trophy text-yellow-500 text-2xl"></i>
              </div>
            </header>

            {/* KLASSE-VELGER BJELKE */}
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3 flex-1 min-w-[240px]">
                <div className="bg-indigo-100 text-indigo-700 p-2.5 rounded-xl">
                  <i className="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div className="flex-1">
                  <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">Aktiv Gruppe / Fag</label>
                  <select 
                    value={activeClassId} 
                    onChange={(e) => handleSelectClass(e.target.value)} 
                    className="w-full bg-slate-50 border border-slate-200 font-bold text-indigo-900 text-base py-1.5 px-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                  >
                    {classes.map(c => (
                      <option key={c.id} value={c.id}>{c.name} ({c.students ? c.students.length : 0} elever)</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowNewClassModal(true)} 
                  className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition-all flex items-center gap-2 shadow-md shadow-indigo-200"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Ny klasse / fag</span>
                </button>
                {classes.length > 1 && (
                  <button 
                    onClick={() => deleteClass(activeClassId)} 
                    title="Slett denne klassen"
                    className="text-slate-400 hover:text-red-600 p-2.5 rounded-xl hover:bg-red-50 transition-colors"
                  >
                    <i className="fa-solid fa-trash-can"></i>
                  </button>
                )}
              </div>
            </div>

            {/* MODAL FOR NY KLASSE */}
            {showNewClassModal && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-xl font-bold text-slate-900">Opprett ny klasse / fag</h3>
                    <button onClick={() => setShowNewClassModal(false)} className="text-slate-400 hover:text-slate-600">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>
                  <p className="text-sm text-slate-500 mb-4">
                    Legg til et nytt fag eller klasse (f.eks. "Tysk 8A", "Norsk 9B"). Hver klasse har sin egen elevliste og poengoversikt.
                  </p>
                  <input 
                    type="text" 
                    placeholder="F.eks. Tysk, Norsk 8B..." 
                    value={newClassName} 
                    onChange={(e) => setNewClassName(e.target.value)} 
                    onKeyDown={(e) => e.key === 'Enter' && addClass()}
                    className="w-full p-3 rounded-xl border border-slate-200 mb-6 outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                    autoFocus
                  />
                  <div className="flex gap-3 justify-end">
                    <button onClick={() => setShowNewClassModal(false)} className="px-4 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 text-sm">
                      Avbryt
                    </button>
                    <button onClick={addClass} className="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-200 text-sm">
                      Opprett klasse
                    </button>
                  </div>
                </div>
              </div>
            )}

            <nav className="flex gap-2 mb-6 bg-slate-200/50 p-1 rounded-xl">
              <button onClick={() => setActiveTab('summary')} className={`flex-1 py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-all ${activeTab === 'summary' ? 'bg-white shadow-sm text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-200'}`}>
                <i className="fa-solid fa-chart-line"></i> Sammenlagt
              </button>
              <button onClick={() => setActiveTab('results')} className={`flex-1 py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-all ${activeTab === 'results' ? 'bg-white shadow-sm text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-200'}`}>
                <i className="fa-solid fa-award"></i> Registrer
              </button>
              <button onClick={() => setActiveTab('students')} className={`flex-1 py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-all ${activeTab === 'students' ? 'bg-white shadow-sm text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-200'}`}>
                <i className="fa-solid fa-users"></i> Elever
              </button>
            </nav>

            <main className="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6">
              {activeTab === 'summary' && (
                <div className="space-y-8">
                  <section>
                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                      <i className="fa-solid fa-award text-indigo-500"></i> Topp 3 Lederne – {currentClass.name}
                    </h2>
                    <Podium />
                  </section>
                  <section>
                    <h2 className="text-xl font-bold mb-4">Poengtavle</h2>
                    <div className="divide-y divide-slate-100">
                      {leaderboard.length === 0 ? (
                        <p className="text-slate-400 italic py-4">Ingen elever registrert for {currentClass.name}. Legg til elever under «Elever»-fanen.</p>
                      ) : (
                        leaderboard.map((student, index) => (
                          <div key={`leader-${student.name}`} className="flex items-center py-4 px-2 hover:bg-slate-50 rounded-xl transition-colors">
                            <span className="w-8 font-bold text-slate-400">{index + 1}.</span>
                            <span className="flex-1 font-semibold">{student.name}</span>
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm font-bold">
                              {student.score} poeng
                            </span>
                          </div>
                        ))
                      )}
                    </div>
                  </section>
                </div>
              )}

              {activeTab === 'results' && (
                <div className="space-y-8">
                  <section className="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-xl font-bold flex items-center gap-2 text-indigo-900">
                        <i className="fa-solid fa-plus text-indigo-600"></i> Registrer poeng ({currentClass.name})
                      </h2>
                      <div className="flex items-center gap-2">
                        <label className="text-sm font-bold text-slate-600">Uke:</label>
                        <input type="number" value={currentWeek} onChange={(e) => setCurrentWeek(e.target.value)} className="w-16 p-2 rounded-lg border border-slate-200 outline-none" />
                      </div>
                    </div>

                    {error && (
                      <div className="mb-4 p-3 bg-red-100 text-red-700 rounded-lg flex items-center gap-2 text-sm font-medium">
                        <i className="fa-solid fa-circle-exclamation"></i> {error}
                      </div>
                    )}

                    <div className="space-y-4 mb-6">
                      <div className="hidden md:grid grid-cols-12 gap-2 px-2 text-xs font-bold text-slate-500 uppercase">
                        <div className="col-span-2">Plass</div>
                        <div className="col-span-6">Elev</div>
                        <div className="col-span-3">Poeng</div>
                        <div className="col-span-1"></div>
                      </div>
                      
                      {tempWinners.map((winner, idx) => (
                        <div key={`row-${idx}`} className="grid grid-cols-1 md:grid-cols-12 gap-2 items-center bg-white p-3 md:p-0 md:bg-transparent rounded-xl border md:border-0 border-slate-100 shadow-sm md:shadow-none">
                          <div className="md:col-span-2 flex items-center gap-2">
                            <span className="md:hidden text-xs font-bold text-slate-400">Plass:</span>
                            <input type="number" value={winner.rank} onChange={(e) => updateWinnerRow(idx, 'rank', e.target.value)} className="w-full p-2 rounded-lg border border-slate-200" placeholder="Plass" />
                          </div>
                          <div className="md:col-span-6 flex items-center gap-2">
                            <span className="md:hidden text-xs font-bold text-slate-400">Elev:</span>
                            <select value={winner.name} onChange={(e) => updateWinnerRow(idx, 'name', e.target.value)} className="w-full p-2 rounded-lg border border-slate-200">
                              <option value="">Velg elev...</option>
                              {students.map(s => <option key={`s-opt-${s}`} value={s}>{s}</option>)}
                            </select>
                          </div>
                          <div className="md:col-span-3 flex items-center gap-2">
                            <span className="md:hidden text-xs font-bold text-slate-400">Poeng:</span>
                            <input type="number" value={winner.points} onChange={(e) => updateWinnerRow(idx, 'points', e.target.value)} className="w-full p-2 rounded-lg border border-slate-200" placeholder="Poeng" />
                          </div>
                          <div className="md:col-span-1 flex justify-end">
                            <button onClick={() => removeWinnerRow(idx)} className="text-slate-300 hover:text-red-500 p-2">
                              <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3">
                      <button onClick={addWinnerRow} className="flex-1 border-2 border-dashed border-indigo-200 text-indigo-600 py-3 rounded-xl font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2">
                        <i className="fa-solid fa-plus"></i> Legg til deltaker (delt plass?)
                      </button>
                      <button onClick={addWeeklyResult} disabled={students.length === 0} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 disabled:bg-slate-300 transition-colors shadow-lg shadow-indigo-200">
                        Lagre ukesresultat
                      </button>
                    </div>
                  </section>

                  <section>
                    <h3 className="font-bold text-slate-700 mb-4">Siste registreringer ({currentClass.name})</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {[...weeklyResults].reverse().map((res, i) => (
                        <div key={`history-${res.week}-${i}`} className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                          <div className="flex justify-between items-center mb-2">
                            <span className="font-bold text-indigo-900">Uke {res.week}</span>
                            <span className="text-xs text-slate-400">{res.winners.length} deltakere</span>
                          </div>
                          <div className="space-y-1">
                            {res.winners.sort((a,b) => a.rank - b.rank).map((w, idx) => (
                              <div key={`win-${i}-${idx}`} className="flex justify-between text-sm">
                                <span className="text-slate-600">{w.rank}. {w.name}</span>
                                <span className="font-bold text-indigo-600">+{w.points}p</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                </div>
              )}

              {activeTab === 'students' && (
                <div className="space-y-6">
                  <section>
                    <h2 className="text-xl font-bold mb-4">Elever i {currentClass.name}</h2>
                    <div className="flex gap-2 mb-6">
                      <input type="text" placeholder="Navn på elev..." className="flex-1 p-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addStudent()} />
                      <button onClick={addStudent} className="bg-indigo-600 text-white px-6 rounded-xl hover:bg-indigo-700 font-bold">Legg til</button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                      {students.map(name => (
                        <div key={`student-${name}`} className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl">
                          <span className="font-medium text-slate-700">{name}</span>
                          <button onClick={() => removeStudent(name)} className="text-slate-300 hover:text-red-500 transition-colors">
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                      ))}
                    </div>
                  </section>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
