<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematikk - Min Skoleportal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        
        <!-- Tilbake-knapp til hovedportalen -->
        <a href="../index.html" class="inline-flex items-center text-sm font-semibold text-slate-600 hover:text-emerald-600 transition mb-6 group">

        </a>

        <!-- Header -->

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                <div>
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl mb-4">

                    </div>

                    <p class="text-slate-500 text-sm mb-4">Øving på sannsynlighet.</p>
                </div>
                <a href="sammensatte.html" class="inline-flex items-center justify-center w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition">
                    Start <i class="fa-solid fa-play ml-2 text-xs"></i>
                </a>
            </div>
 <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                <div>
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">Store talls lov</h2>
                    <p class="text-slate-500 text-sm mb-4">Simulering av store talls lov.</p>
                </div>
                <a href="sannsynlighet.html" class="inline-flex items-center justify-center w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition">
                    Start <i class="fa-solid fa-play ml-2 text-xs"></i>
                </a>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                <div>
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                   
             
            </div>

        </div>
    </div>

</html>
