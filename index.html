<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassens Apper</title>
  <style>
    /* Bakgrunn og skrifttype */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hovedoverskrift */
    h1 {
      color: #1e293b;
      margin-bottom: 8px;
    }
    
    p.undertittel {
      color: #64748b;
      margin-bottom: 32px;
    }

    /* Rutenett for app-knappene */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    /* Kort/knapper for hver app */
    .app-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      text-decoration: none;
      color: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    /* Effekter når musen peker på knappen */
    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border-color: #3b82f6;
    }

    .app-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .app-title {
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <h1>Velkommen til læringsappene!</h1>
  <p class="undertittel">Velg appen du skal jobbe med i dag:</p>

  <div class="app-grid">
    
    <!-- App 1 -->
    <a href="Klasseromskjerm.html" class="app-card">
      <div class="app-icon">📐</div>
      <div class="app-title">Klasseromskjerm</div>
    </a>

    <!-- App 2 -->
    <a href="Programmering.html" class="app-card">
      <div class="app-icon">🌍</div>
      <div class="app-title">Programmering</div>
    </a>

    <!-- Legg til flere apper ved å kopiere blokkene over -->

  </div>

</body>
</html>
