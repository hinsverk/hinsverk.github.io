<!DOCTYPE html>
<html lang="no"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryssord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell {
            width: 40px;
            height: 40px;
            border: 1px solid #cbd5e1;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            background-color: white;
            transition: background-color 0.15s;
        }
        
        .cell.black {
            background-color: #1e293b;
            border-color: #1e293b;
        }
        
        .cell.solution-cell {
            background-color: #fef08a;
        }

        /* Utheving av aktivt ord */
        .cell.active-word {
            background-color: #e0e7ff;
        }
        .cell.solution-cell.active-word {
            background-color: #fde047;
        }
        
        .cell-number {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.65rem;
            color: #64748b;
            pointer-events: none;
            line-height: 1;
            z-index: 10;
        }

        input.cell-input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            background: transparent;
            outline: none;
            font-size: 1.25rem;
            color: #1e293b;
            caret-color: #4f46e5;
            position: relative;
            z-index: 5;
        }

        input.cell-input:focus {
            background-color: #bae6fd !important;
        }

        input.correct {
            color: #059669;
            background-color: #dcfce7;
        }

        input.wrong {
            color: #dc2626;
            background-color: #fee2e2;
        }
        
        .cell.solution-cell input.correct {
            background-color: #fef9c3;
        }

        input.hinted {
            color: #7c3aed; 
            background-color: #f3e8ff;
        }

        .solution-word-box {
            width: 40px;
            height: 50px;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 900;
            border-radius: 6px;
            background: white;
            color: #1e293b;
            transition: all 0.2s;
            cursor: pointer;
        }

        .solution-word-box.space {
            border: none;
            background: transparent;
            width: 20px;
            cursor: default;
        }

        .solution-word-box.filled {
            border-color: #facc15;
            background: #fefce8;
        }

        .letter-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }

        .letter-pill:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .letter-pill.used {
            opacity: 0.3;
            pointer-events: none;
            background: #f1f5f9;
        }

        .warning-text {
            color: #ef4444;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        /* Utheving av aktivt hint i listen */
        .clue-item {
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
        }
        .clue-item:hover {
            background-color: #e2e8f0;
        }
        .clue-item.active-clue {
            background-color: #e0e7ff;
            border-color: #6366f1;
        }

        /* Utskriftsvennlig visning */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
            }
            #admin-panel, #hint-btn, #check-answers-btn, #print-btn, #back-btn, #student-badge, #anagram-bank-container, #reset-anagram-btn {
                display: none !important;
            }
            #main-container {
                max-width: 100% !important;
                padding: 0 !important;
            }
            header {
                background: white !important;
                color: black !important;
                box-shadow: none !important;
                border-bottom: 2px solid black;
                border-radius: 0 !important;
                padding: 10px 0 !important;
                margin-bottom: 20px !important;
            }
            header p {
                color: #333 !important;
            }
            #grid-column {
                grid-column: span 12 / span 12 !important;
            }
            #grid-column > div {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
            #grid-wrapper {
                background: transparent !important;
                padding: 0 !important;
            }
            #grid {
                background: black !important;
                border: 2px solid black !important;
            }
            .cell {
                border: 1px solid black !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .cell.black {
                background-color: black !important;
            }
            .cell.solution-cell {
                background-color: #e5e7eb !important; /* Svak grå på utskrift */
            }
            .cell.active-word {
                background-color: white !important;
            }
            .cell.solution-cell.active-word {
                background-color: #e5e7eb !important;
            }
            /* Skjul fasit-bokstaver ved utskrift fra lærermodus */
            input.cell-input {
                color: transparent !important;
                background: transparent !important;
            }
            .solution-word-box {
                border: 2px solid black !important;
                color: transparent !important;
                background: white !important;
            }
            .solution-word-box.space {
                border: none !important;
            }
            .clue-item {
                background: transparent !important;
                border: none !important;
                padding: 4px 0 !important;
            }
        }
    </style>

<body class="bg-slate-50 min-h-screen pb-20">

    <div id="main-container" class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="bg-indigo-700 rounded-2xl p-6 text-white mb-8 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto">
                <a id="back-btn" href="../index.html" class="bg-white/15 hover:bg-white/25 text-white px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 shrink-0" title="Tilbake til oversikten">
                    <span>←</span>
                    <span>Tilbake</span>
                </a>
                <div>
                    <h1 id="title-text" class="text-3xl font-black tracking-tight">Kryssordgenerator</h1>
                    <p id="sub-text" class="text-indigo-100 italic">Lag pedagogiske kryssord med hemmelige løsningsord.</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="print-btn" onclick="window.print()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2">
                    <span>🖨️</span>
                    <span>Skriv ut</span>
                </button>
                <button id="check-answers-btn" onclick="manualCheckAnswers()" class="hidden bg-emerald-500 hover:bg-emerald-400 text-white px-5 py-2 rounded-xl font-bold text-sm transition shadow-md flex items-center gap-2">
                    <span>✓</span>
                    <span>Sjekk svar</span>
                </button>
                <button id="hint-btn" onclick="giveHint()" class="hidden bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-xl font-bold text-sm transition shadow-md flex items-center gap-2">
                    <span>💡</span>
                    <span id="hint-text">Hjelp (3 igjen)</span>
                </button>
                <div id="student-badge" class="hidden bg-yellow-400 text-yellow-900 px-5 py-2 rounded-full font-black text-xs uppercase tracking-widest shadow-md">
                    Løsemodus
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            

            <div id="grid-column" class="lg:col-span-12">
                <div class="flex flex-col items-center bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200">
                    <div id="grid-wrapper" class="p-2 bg-slate-200 rounded-lg overflow-auto max-w-full">
                        <div id="grid" class="grid bg-slate-400 gap-[1px] border border-slate-400" style="grid-template-columns: repeat(29, 40px);"></div>
                    </div>

                    <!-- Løsningssetning Seksjon -->
                    <div id="solution-word-container" class="mt-8 hidden flex flex-col items-center w-full">
                        <div class="flex items-center gap-3 mb-4">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em]">Løsningssetning</h3>
                            <button id="reset-anagram-btn" onclick="resetAnagram()" class="hidden text-[10px] bg-slate-200 hover:bg-slate-300 text-slate-600 px-2 py-1 rounded font-bold uppercase transition">Nullstill</button>
                        </div>
                        
                        <div id="solution-boxes" class="flex flex-wrap justify-center gap-2 max-w-2xl mb-6"></div>
                        
                        <!-- Bokstavbank for Anagram-modus -->
                        <div id="anagram-bank-container" class="hidden w-full bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-300 text-center">
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-3">Klikk på bokstavene for å stave setningen</p>
                            <div id="anagram-bank" class="flex flex-wrap justify-center gap-2"></div>
                        </div>
                    </div>

                    <div id="clues-container" class="w-full mt-10 grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div>
                            <h3 class="text-lg font-black text-indigo-700 mb-4 border-b-4 border-indigo-100 pb-2 flex items-center gap-2">
                                <span class="bg-indigo-700 text-white w-6 h-6 rounded flex items-center justify-center text-xs">→</span> Vannrett
                            </h3>
                            <ul id="across-list" class="space-y-2 text-sm text-slate-700"></ul>
                        </div>
                        <div>
                            <h3 class="text-lg font-black text-emerald-700 mb-4 border-b-4 border-emerald-100 pb-2 flex items-center gap-2">
                                <span class="bg-emerald-700 text-white w-6 h-6 rounded flex items-center justify-center text-xs">↓</span> Loddrett
                            </h3>
                            <ul id="down-list" class="space-y-2 text-sm text-slate-700"></ul>
                        </div>
                    </div>

                    <div id="solve-msg" class="hidden fixed inset-0 flex items-center justify-center z-[300] bg-slate-900/50 backdrop-blur-sm">
                        <div class="bg-white p-8 rounded-3xl shadow-2xl border-4 border-emerald-500 text-center max-w-sm w-full mx-4">
                            <div class="text-6xl mb-4">🏆</div>
                            <h2 class="text-2xl font-black text-emerald-800 mb-2">ALT RIKTIG!</h2>
                            <p class="text-slate-600 mb-6">Fantastisk jobba! Du har løst hele kryssordet og funnet løsningssetningen.</p>
                            <button onclick="document.getElementById('solve-msg').classList.add('hidden')" class="bg-emerald-600 text-white px-8 py-3 rounded-full font-bold hover:bg-emerald-700 transition">Lukk</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <script>
        let bestGrid = [];
        let bestPlacedWords = [];
        let solutionMap = []; 
        let targetSolutionPhrase = "";
        let currentSolutionMode = 'direct'; 
        let currentFeedbackMode = 'instant'; // 'instant' eller 'manual'
        let hasMissingSolutionLetters = false;
        
        let studentAnagramPicks = []; 

        let isSolveMode = false;
        let hintsLeft = 3; 
        let currentFocus = null;
        let typingDirection = 'across'; 
        const GRID_SIZE = 50; 
        const CIPHER_KEY = "KRYSSORD_SKOLE_2026"; // Enkel obfuskering mot nysgjerrige elever

        window.addEventListener('load', () => {
            if (window.STUDENT_DATA) {
                isSolveMode = true;
                loadSolveMode();
            } else {
                initDefault();
            }
            document.addEventListener('keydown', handleGlobalKey);
            document.addEventListener('input', handleGlobalInput);
            document.addEventListener('focusin', handleFocusIn);
            document.addEventListener('mousedown', handleGridMouseDown);
        });

        // Enkel XOR-obfuskering slik at fasit ikke ligger i klartekst ved atob()
        function obfuscateData(str) {
            const bytes = new TextEncoder().encode(str);
            const keyBytes = new TextEncoder().encode(CIPHER_KEY);
            const xored = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) {
                xored[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
            }
            let binary = "";
            for (let i = 0; i < xored.byteLength; i++) binary += String.fromCharCode(xored[i]);
            return btoa(binary);
        }

        function deobfuscateData(base64) {
            const binary = atob(base64);
            const xored = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) xored[i] = binary.charCodeAt(i);
            const keyBytes = new TextEncoder().encode(CIPHER_KEY);
            const bytes = new Uint8Array(xored.length);
            for (let i = 0; i < xored.length; i++) {
                bytes[i] = xored[i] ^ keyBytes[i % keyBytes.length];
            }
            return new TextDecoder().decode(bytes);
        }

        function setSolutionMode(mode) {
            currentSolutionMode = mode;
            const dirBtn = document.getElementById('mode-direct');
            const anaBtn = document.getElementById('mode-anagram');
            if(mode === 'direct') {
                dirBtn.className = "py-2 px-3 rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-xs transition";
                anaBtn.className = "py-2 px-3 rounded-lg border-2 border-slate-200 bg-white text-slate-500 font-bold text-xs transition";
            } else {
                anaBtn.className = "py-2 px-3 rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-xs transition";
                dirBtn.className = "py-2 px-3 rounded-lg border-2 border-slate-200 bg-white text-slate-500 font-bold text-xs transition";
            }
            renderSolutionBoxes();
        }

        function setFeedbackMode(mode) {
            currentFeedbackMode = mode;
            const instBtn = document.getElementById('fb-instant');
            const manBtn = document.getElementById('fb-manual');
            if(mode === 'instant') {
                instBtn.className = "py-2 px-3 rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-xs transition";
                manBtn.className = "py-2 px-3 rounded-lg border-2 border-slate-200 bg-white text-slate-500 font-bold text-xs transition";
            } else {
                manBtn.className = "py-2 px-3 rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-xs transition";
                instBtn.className = "py-2 px-3 rounded-lg border-2 border-slate-200 bg-white text-slate-500 font-bold text-xs transition";
            }
        }

        // Klikk på allerede valgt rute bytter retning (vannrett <-> loddrett)
        function handleGridMouseDown(e) {
            if (!e.target.classList.contains('cell-input')) return;
            if (document.activeElement === e.target) {
                const r = parseInt(e.target.dataset.r), c = parseInt(e.target.dataset.c);
                const hasAcross = document.getElementById(`c-${r}-${c+1}`) || document.getElementById(`c-${r}-${c-1}`);
                const hasDown = document.getElementById(`c-${r+1}-${c}`) || document.getElementById(`c-${r-1}-${c}`);
                
                if (typingDirection === 'across' && hasDown) {
                    typingDirection = 'down';
                } else if (typingDirection === 'down' && hasAcross) {
                    typingDirection = 'across';
                }
                highlightActiveWord(r, c, typingDirection);
            }
        }

        function handleFocusIn(e) {
            if(!e.target.classList.contains('cell-input')) return;
            const r = parseInt(e.target.dataset.r), c = parseInt(e.target.dataset.c);
            
            // Sjekk om nåværende retning er gyldig for denne ruten
            const hasAcross = document.getElementById(`c-${r}-${c+1}`) || document.getElementById(`c-${r}-${c-1}`);
            const hasDown = document.getElementById(`c-${r+1}-${c}`) || document.getElementById(`c-${r-1}-${c}`);
            
            if (typingDirection === 'across' && !hasAcross && hasDown) typingDirection = 'down';
            else if (typingDirection === 'down' && !hasDown && hasAcross) typingDirection = 'across';

            currentFocus = e.target;
            e.target.select();
            highlightActiveWord(r, c, typingDirection);
        }

        // Uthever hele det aktive ordet i rutenettet og det tilhørende hintet i listen
        function highlightActiveWord(r, c, dir) {
            document.querySelectorAll('.cell.active-word').forEach(el => el.classList.remove('active-word'));
            document.querySelectorAll('.clue-item.active-clue').forEach(el => el.classList.remove('active-clue'));

            // Finn ordet som dekker (r, c) i retning `dir`
            const activeWord = bestPlacedWords.find(w => {
                if (w.dir !== dir) return false;
                if (dir === 'across') return w.row === r && c >= w.col && c < w.col + w.answer.length;
                if (dir === 'down') return w.col === c && r >= w.row && r < w.row + w.answer.length;
                return false;
            });

            if (activeWord) {
                for (let i = 0; i < activeWord.answer.length; i++) {
                    const rr = dir === 'across' ? activeWord.row : activeWord.row + i;
                    const cc = dir === 'across' ? activeWord.col + i : activeWord.col;
                    const input = document.getElementById(`c-${rr}-${cc}`);
                    if (input && input.parentElement) {
                        input.parentElement.classList.add('active-word');
                    }
                }
                const clueEl = document.getElementById(`clue-${activeWord.dir}-${activeWord.n}`);
                if (clueEl) {
                    clueEl.classList.add('active-clue');
                }
            }
        }

        function loadSolveMode() {
            try {
                const jsonStr = deobfuscateData(window.STUDENT_DATA);
                const data = JSON.parse(jsonStr);

                bestGrid = data.grid;
                bestPlacedWords = data.words;
                solutionMap = data.solutionMap || [];
                targetSolutionPhrase = data.targetSolutionPhrase || "";
                currentSolutionMode = data.solutionMode || 'direct';
                currentFeedbackMode = data.feedbackMode || 'instant';
                
                document.getElementById('student-badge').classList.remove('hidden');
                document.getElementById('hint-btn').classList.remove('hidden');
                if (currentFeedbackMode === 'manual') {
                    document.getElementById('check-answers-btn').classList.remove('hidden');
                }

                document.getElementById('title-text').innerText = "Kryssord-oppgave";
                document.getElementById('sub-text').innerText = "Fyll ut kryssordet og finn løsningssetningen!";
                
                if(currentSolutionMode === 'anagram') {
                    document.getElementById('reset-anagram-btn').classList.remove('hidden');
                    document.getElementById('anagram-bank-container').classList.remove('hidden');
                    studentAnagramPicks = Array(targetSolutionPhrase.length).fill(null);
                }

                renderGrid();
                renderSolutionBoxes();
            } catch (e) {
                console.error("Feil ved lasting av kryssorddata", e);
            }
        }

        function renderSolutionBoxes() {
            const container = document.getElementById('solution-word-container');
            const boxContainer = document.getElementById('solution-boxes');
            if (!targetSolutionPhrase) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            boxContainer.innerHTML = '';
            
            for (let i = 0; i < targetSolutionPhrase.length; i++) {
                const char = targetSolutionPhrase[i];
                const box = document.createElement('div');
                if (char === " ") {
                    box.className = 'solution-word-box space';
                } else {
                    box.className = 'solution-word-box';
                    box.id = `sol-box-${i}`;
                    if(currentSolutionMode === 'anagram' && isSolveMode) {
                        box.onclick = () => removeAnagramLetter(i);
                    }
                }
                boxContainer.appendChild(box);
            }
            updateSolutionBoxes();
        }

        function updateSolutionBoxes() {
            if (!targetSolutionPhrase) return;

            if (currentSolutionMode === 'direct') {
                solutionMap.forEach((pos, idx) => {
                    if (pos && pos.r !== -1) { 
                        const input = document.getElementById(`c-${pos.r}-${pos.c}`);
                        const box = document.getElementById(`sol-box-${idx}`);
                        if (input && box) {
                            box.innerText = input.value;
                            if (input.value) box.classList.add('filled');
                            else box.classList.remove('filled');
                        }
                    }
                });
            } else if (currentSolutionMode === 'anagram') {
                renderAnagramBank();
                studentAnagramPicks.forEach((letterObj, idx) => {
                    const box = document.getElementById(`sol-box-${idx}`);
                    if (box) {
                        box.innerText = letterObj ? letterObj.char : '';
                        if (letterObj) box.classList.add('filled');
                        else box.classList.remove('filled');
                    }
                });
            }
        }

        function renderAnagramBank() {
            const bankEl = document.getElementById('anagram-bank');
            if(!bankEl) return;
            bankEl.innerHTML = '';

            let availableLetters = [];
            solutionMap.forEach((pos) => {
                if(pos && pos.r !== -1) {
                    const input = document.getElementById(`c-${pos.r}-${pos.c}`);
                    if(input && input.value) {
                        availableLetters.push({
                            id: `source-${pos.r}-${pos.c}`,
                            char: input.value.toUpperCase()
                        });
                    }
                }
            });

            availableLetters.sort((a,b) => a.id.localeCompare(b.id));

            availableLetters.forEach(item => {
                const isUsed = studentAnagramPicks.some(p => p && p.id === item.id);
                const pill = document.createElement('div');
                pill.className = `letter-pill ${isUsed ? 'used' : ''}`;
                pill.innerText = item.char;
                pill.onclick = () => { if(!isUsed) useAnagramLetter(item); };
                bankEl.appendChild(pill);
            });
        }

        function useAnagramLetter(item) {
            const emptyIdx = studentAnagramPicks.findIndex((p, idx) => p === null && targetSolutionPhrase[idx] !== " ");
            if(emptyIdx !== -1) {
                studentAnagramPicks[emptyIdx] = item;
                updateSolutionBoxes();
                checkVictory();
            }
        }

        function removeAnagramLetter(idx) {
            if(studentAnagramPicks[idx]) {
                studentAnagramPicks[idx] = null;
                updateSolutionBoxes();
            }
        }

        function resetAnagram() {
            studentAnagramPicks = Array(targetSolutionPhrase.length).fill(null);
            updateSolutionBoxes();
        }

        function giveHint() {
            if (hintsLeft <= 0 || !currentFocus) return;
            const r = currentFocus.dataset.r, c = currentFocus.dataset.c;
            const correctChar = bestGrid[r][c];
            if (currentFocus.value === correctChar) return;

            currentFocus.value = correctChar;
            currentFocus.classList.remove('wrong');
            currentFocus.classList.add('hinted', 'correct');
            hintsLeft--;
            document.getElementById('hint-text').innerText = `Hjelp (${hintsLeft} igjen)`;
            if (hintsLeft === 0) document.getElementById('hint-btn').classList.add('opacity-50', 'cursor-not-allowed');
            updateSolutionBoxes();
            checkVictory();
        }

        function manualCheckAnswers() {
            const inputs = document.querySelectorAll('.cell-input');
            inputs.forEach(input => {
                if (input.classList.contains('hinted')) return;
                const val = input.value.toUpperCase();
                const correctChar = bestGrid[input.dataset.r][input.dataset.c];
                input.classList.remove('correct', 'wrong');
                if (val !== "") {
                    if (val === correctChar) input.classList.add('correct');
                    else input.classList.add('wrong');
                }
            });
            checkVictory();
        }

        function saveDraft() {
            if (isSolveMode) return;
            localStorage.setItem('kryssord_draft_words', document.getElementById('word-list').value);
            localStorage.setItem('kryssord_draft_sol', document.getElementById('final-solution-input').value);
        }

        function initDefault() {
            const savedWords = localStorage.getItem('kryssord_draft_words');
            const savedSol = localStorage.getItem('kryssord_draft_sol');

            if (savedWords !== null) {
                document.getElementById('word-list').value = savedWords;
                document.getElementById('final-solution-input').value = savedSol || "";
            } else {
                document.getElementById('final-solution-input').value = "LÆRING ER GØY";
                document.getElementById('word-list').value = "BÅT: Noe som flyter på vannet\nØY: Land omgitt av vann\nÅS: En liten høyde i terrenget\nTRÆR: Grønne planter i skogen\nBØKER: Noe man leser i\nSØVN: Det man gjør om natta\nKÅL: En grønnsak";
            }
            generateMultipleTimes();
        }

        function generateMultipleTimes() {
            const rawText = document.getElementById('word-list').value;
            targetSolutionPhrase = document.getElementById('final-solution-input').value.trim().toUpperCase();
            saveDraft();
            
            const lines = rawText.split(/\r?\n/).filter(l => l.trim() !== "" && l.includes(':'));
            const allWords = lines.map(l => {
                const p = l.split(':');
                return { answer: p[0].trim().toUpperCase().replace(/\s/g, ''), hint: p.slice(1).join(':').trim() };
            }).filter(o => o.answer.length > 0);

            if (allWords.length === 0) return;

            let bestScore = -1;
            let highestWordsPlaced = 0;
            let winnerG = [], winnerW = [];
            const sortedWords = [...allWords].sort((a,b) => b.answer.length - a.answer.length);

            for (let i = 0; i < 60; i++) {
                // Behold lengste ord først oftere, men bland resten for variasjon
                const attemptWords = i === 0 ? sortedWords : [sortedWords[0], ...sortedWords.slice(1).sort(() => Math.random() - 0.5)];
                const result = attemptGeneration(attemptWords);
                
                // Poengsystem: antall plasserte ord teller mest, deretter antall krysningspunkter
                const totalScore = (result.placed.length * 100) + result.intersections;
                if (totalScore > bestScore) {
                    bestScore = totalScore;
                    highestWordsPlaced = result.placed.length;
                    winnerG = result.grid;
                    winnerW = result.placed;
                }
            }

            bestGrid = winnerG;
            bestPlacedWords = winnerW;
            mapSolutionPhrase();
            document.getElementById('stats').innerText = `${highestWordsPlaced} av ${allWords.length} ord plassert`;
            renderGrid();
            renderSolutionBoxes();
        }

        function mapSolutionPhrase() {
            solutionMap = [];
            hasMissingSolutionLetters = false;
            const warningEl = document.getElementById('solution-warning');
            const shareWarningEl = document.getElementById('share-warning');
            const shareBtn = document.getElementById('share-btn');

            if (!targetSolutionPhrase) {
                warningEl.classList.add('hidden');
                if (shareWarningEl) shareWarningEl.classList.add('hidden');
                if (shareBtn) shareBtn.disabled = false;
                return;
            }
            
            let usedCells = new Set();

            for (let i = 0; i < targetSolutionPhrase.length; i++) {
                const char = targetSolutionPhrase[i];
                if (char === " ") {
                    solutionMap.push(null); 
                    continue;
                }
                
                let found = false;
                for(let r=0; r<GRID_SIZE; r++) {
                    for(let c=0; c<GRID_SIZE; c++) {
                        if (bestGrid[r][c] === char && !usedCells.has(`${r},${c}`)) {
                            solutionMap.push({r: r, c: c, char: char});
                            usedCells.add(`${r},${c}`);
                            found = true;
                            break; 
                        }
                    }
                    if (found) break;
                }
                if (!found) {
                    solutionMap.push({r: -1, c: -1, char: char});
                    hasMissingSolutionLetters = true;
                }
            }

            if (hasMissingSolutionLetters) {
                warningEl.classList.remove('hidden');
                if (shareWarningEl) shareWarningEl.classList.remove('hidden');
                if (shareBtn) shareBtn.disabled = true;
            } else {
                warningEl.classList.add('hidden');
                if (shareWarningEl) shareWarningEl.classList.add('hidden');
                if (shareBtn) shareBtn.disabled = false;
            }
        }

        // Forbedret algoritme som belønner tette krysningspunkter nær midten
        function attemptGeneration(words) {
            let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
            let placed = [];
            let totalIntersections = 0;

            const first = words[0];
            const r = 25, c = 25 - Math.floor(first.answer.length/2);
            for(let i=0; i<first.answer.length; i++) grid[r][c+i] = first.answer[i];
            placed.push({...first, row: r, col: c, dir: 'across'});

            for(let i=1; i<words.length; i++) {
                const word = words[i].answer;
                let cands = [];
                for(let row=0; row<GRID_SIZE; row++) {
                    for(let col=0; col<GRID_SIZE; col++) {
                        if(grid[row][col] && word.includes(grid[row][col])) {
                            word.split('').forEach((char, idx) => {
                                if(char === grid[row][col]) {
                                    const downScore = scorePlacement(word, row-idx, col, 'down', grid);
                                    if(downScore > 0) cands.push({r:row-idx, c:col, d:'down', score: downScore});
                                    
                                    const acrossScore = scorePlacement(word, row, col-idx, 'across', grid);
                                    if(acrossScore > 0) cands.push({r:row, c:col-idx, d:'across', score: acrossScore});
                                }
                            });
                        }
                    }
                }
                if(cands.length > 0) {
                    // Sorter etter høyest poengsum (flest kryss + nærhet til sentrum), med litt tilfeldighet
                    cands.sort((a, b) => (b.score + Math.random() * 2) - (a.score + Math.random() * 2));
                    const p = cands[0];
                    
                    for(let j=0; j<word.length; j++) {
                        const rr = p.d === 'across' ? p.r : p.r+j, cc = p.d === 'across' ? p.c+j : p.c;
                        if (grid[rr][cc] === word[j]) totalIntersections++;
                        grid[rr][cc] = word[j];
                    }
                    placed.push({...words[i], row: p.r, col: p.c, dir: p.d});
                }
            }
            return {grid, placed, intersections: totalIntersections};
        }

        function scorePlacement(w, r, c, d, g) {
            if(r<1 || c<1 || (d==='across' && c+w.length>=GRID_SIZE-1) || (d==='down' && r+w.length>=GRID_SIZE-1)) return 0;
            let inters = 0;
            for(let i=0; i<w.length; i++) {
                const rr = d==='across'?r:r+i, cc = d==='across'?c+i:c;
                if(g[rr][cc] && g[rr][cc] !== w[i]) return 0;
                if(g[rr][cc] === w[i]) {
                    inters++;
                } else {
                    if(d==='across') { if(isOcc(rr-1,cc,g) || isOcc(rr+1,cc,g)) return 0; }
                    else { if(isOcc(rr,cc-1,g) || isOcc(rr,cc+1,g)) return 0; }
                }
            }
            if(d==='across') { if(isOcc(r,c-1,g) || isOcc(r,c+w.length,g)) return 0; }
            else { if(isOcc(r-1,c,g) || isOcc(r+w.length,c,g)) return 0; }
            
            if (inters === 0) return 0;

            // Gi poeng for flere krysningspunkter og nærhet til sentrum (25, 25)
            const distFromCenter = Math.abs(r - 25) + Math.abs(c - 25);
            return (inters * 10) - (distFromCenter * 0.2) + 5;
        }

        function isOcc(r,c,g) { return r>=0 && r<GRID_SIZE && g[r][c] !== null; }

        function renderGrid() {
            let minR = 50, maxR = 0, minC = 50, maxC = 0;
            bestGrid.forEach((row, r) => row.forEach((v, c) => { if(v) { minR=Math.min(minR,r); maxR=Math.max(maxR,r); minC=Math.min(minC,c); maxC=Math.max(maxC,c); }}));
            minR=Math.max(0,minR-1); maxR=Math.min(49,maxR+1); minC=Math.max(0,minC-1); maxC=Math.min(49,maxC+1);

            const gridEl = document.getElementById('grid');
            gridEl.style.gridTemplateColumns = `repeat(${maxC-minC+1}, 40px)`;
            gridEl.innerHTML = '';

            let num = 1;
            const nums = Array(50).fill().map(() => Array(50).fill(0));
            const sorted = [...bestPlacedWords].sort((a,b) => (a.row*50+a.col)-(b.row*50+b.col));
            sorted.forEach(w => { if(nums[w.row][w.col]===0) nums[w.row][w.col]=num++; w.n=nums[w.row][w.col]; });

            for(let r=minR; r<=maxR; r++) {
                for(let c=minC; c<=maxC; c++) {
                    const isSolutionCell = solutionMap.some(p => p && p.r === r && p.c === c);
                    const div = document.createElement('div');
                    div.className = `cell ${bestGrid[r][c]?'':'black'} ${isSolutionCell ? 'solution-cell' : ''}`;
                    if(bestGrid[r][c]) {
                        if(nums[r][c]>0) {
                            const s = document.createElement('span'); s.className='cell-number'; s.innerText=nums[r][c];
                            div.appendChild(s);
                        }
                        const input = document.createElement('input');
                        input.className = 'cell-input'; 
                        input.maxLength = 1; 
                        input.id = `c-${r}-${c}`;
                        input.dataset.r = r; input.dataset.c = c;
                        if(!isSolveMode) input.value = bestGrid[r][c];
                        div.appendChild(input);
                    }
                    gridEl.appendChild(div);
                }
            }

            const al = document.getElementById('across-list'), dl = document.getElementById('down-list');
            al.innerHTML = ''; dl.innerHTML = '';
            sorted.forEach(w => {
                const li = document.createElement('li');
                li.id = `clue-${w.dir}-${w.n}`;
                li.className = "clue-item p-3 bg-slate-100 rounded-xl flex items-start gap-3";
                li.innerHTML = `<span class="bg-white px-2 py-0.5 rounded shadow-sm font-bold text-xs">${w.n}</span><span>${w.hint}</span>`;
                
                // Klikk på hint hopper til ordet og setter riktig retning
                li.onclick = () => {
                    typingDirection = w.dir;
                    const startInput = document.getElementById(`c-${w.row}-${w.col}`);
                    if (startInput) {
                        startInput.focus({ preventScroll: true });
                        startInput.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                        // Sikre at retning og utheving overstyrer eventuelle standard fokus-hendelser
                        setTimeout(() => {
                            typingDirection = w.dir;
                            highlightActiveWord(w.row, w.col, w.dir);
                        }, 0);
                    }
                };

                if(w.dir==='across') al.appendChild(li); else dl.appendChild(li);
            });
        }

        function handleGlobalKey(e) {
            if (!e.target.classList.contains('cell-input')) return;
            const r = parseInt(e.target.dataset.r), c = parseInt(e.target.dataset.c);
            if (e.key === 'ArrowRight') { typingDirection = 'across'; moveFoc(r, c + 1); }
            else if (e.key === 'ArrowLeft') { typingDirection = 'across'; moveFoc(r, c - 1); }
            else if (e.key === 'ArrowDown') { typingDirection = 'down'; moveFoc(r + 1, c); }
            else if (e.key === 'ArrowUp') { typingDirection = 'down'; moveFoc(r - 1, c); }
            else if (e.key === 'Backspace' && !e.target.value) {
                if (typingDirection === 'across') moveFoc(r, c - 1);
                else moveFoc(r - 1, c);
            }
        }

        function handleGlobalInput(e) {
            if (!e.target.classList.contains('cell-input')) return;
            const r = parseInt(e.target.dataset.r), c = parseInt(e.target.dataset.c);
            const val = e.target.value.toUpperCase();
            e.target.value = val;

            e.target.classList.remove('wrong');
            if (currentFeedbackMode === 'instant') {
                if (val === bestGrid[r][c]) e.target.classList.add('correct');
                else e.target.classList.remove('correct');
            } else {
                e.target.classList.remove('correct');
            }

            updateSolutionBoxes();
            if (val.length > 0) {
                setTimeout(() => {
                    if (typingDirection === 'across') moveFoc(r, c + 1);
                    else moveFoc(r + 1, c);
                }, 0);
            }
            checkVictory();
        }

        function moveFoc(r, c) {
            const next = document.getElementById(`c-${r}-${c}`);
            if (next) { next.focus(); return true; }
            return false;
        }

        function shareWithStudents() { 
            if (hasMissingSolutionLetters) return;
            document.getElementById('share-mode-text').innerText = currentSolutionMode === 'direct' ? 'direkte' : 'anagram';
            document.getElementById('share-fb-text').innerText = currentFeedbackMode === 'instant' ? 'umiddelbar' : 'manuell (sjekk-knapp)';
            document.getElementById('share-modal').classList.remove('hidden'); 
        }
        function closeShareModal() { document.getElementById('share-modal').classList.add('hidden'); }

        function downloadStudentFile() {
            const exportData = { 
                grid: bestGrid, 
                words: bestPlacedWords, 
                solutionMap: solutionMap,
                targetSolutionPhrase: targetSolutionPhrase,
                solutionMode: currentSolutionMode,
                feedbackMode: currentFeedbackMode
            };

            const encoded = obfuscateData(JSON.stringify(exportData));

            // Klon dokumentet og rydd bort alt lærer-innhold og forhåndsutfylte ruter
            const docClone = document.documentElement.cloneNode(true);
            const titleTag = docClone.querySelector('title'); if (titleTag) titleTag.innerText = 'Kryssord';
            const admin = docClone.querySelector('#admin-panel'); if (admin) admin.remove();
            const modal = docClone.querySelector('#share-modal'); if (modal) modal.remove();
            const solveMsg = docClone.querySelector('#solve-msg'); if (solveMsg) solveMsg.classList.add('hidden');
            
            // Tøm rendret rutenett og lister i klonen slik at elev-filen bygger alt rent fra STUDENT_DATA
            const gridEl = docClone.querySelector('#grid'); if (gridEl) gridEl.innerHTML = '';
            const acrossEl = docClone.querySelector('#across-list'); if (acrossEl) acrossEl.innerHTML = '';
            const downEl = docClone.querySelector('#down-list'); if (downEl) downEl.innerHTML = '';
            const solBoxesEl = docClone.querySelector('#solution-boxes'); if (solBoxesEl) solBoxesEl.innerHTML = '';

            const gridCol = docClone.querySelector('#grid-column'); if (gridCol) gridCol.className = 'lg:col-span-12';
            
            const scriptStr = `<script>window.STUDENT_DATA = "${encoded}";<\/script>`;
            const finalHTML = `<!DOCTYPE html>\n<html lang="no">${docClone.innerHTML}\n${scriptStr}\n</html>`;
            const blob = new Blob([finalHTML], {type:'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Kryssord_Oppgave.html'; a.click();
            closeShareModal();
        }

        function checkVictory() {
            const inputs = document.querySelectorAll('.cell-input');
            let allCorrect = true;
            inputs.forEach(input => {
                if (input.value.toUpperCase() !== bestGrid[input.dataset.r][input.dataset.c]) allCorrect = false;
            });
            
            let solCorrect = true;
            if (targetSolutionPhrase.length > 0) {
                if (currentSolutionMode === 'direct') {
                    solutionMap.forEach((pos, idx) => {
                        if (pos && pos.r !== -1) {
                            const input = document.getElementById(`c-${pos.r}-${pos.c}`);
                            if (!input || input.value.toUpperCase() !== targetSolutionPhrase[idx]) solCorrect = false;
                        } else if (targetSolutionPhrase[idx] !== " ") {
                            solCorrect = false;
                        }
                    });
                } else {
                    const currentStr = studentAnagramPicks.map(p => p ? p.char : ' ').join('');
                    if (currentStr !== targetSolutionPhrase) solCorrect = false;
                }
            }

            if (allCorrect && solCorrect && inputs.length > 0) {
                setTimeout(() => { document.getElementById('solve-msg').classList.remove('hidden'); }, 200);
            }
        }
    </script>
