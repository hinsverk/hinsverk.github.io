<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tysk Wort-Meister</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <!-- Firebase services -->
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

    <script>
        // Sikker initialisering for Google Sites
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tysk-wort-meister';

        // 1. Hent lokale rekorder umiddelbart (dette fungerer alltid)
        const getLocalScores = () => {
            try {
                const stored = localStorage.getItem(`scores_${appId}`);
                return stored ? JSON.parse(stored) : { easy: 0, medium: 0, hard: 0 };
            } catch(e) {
                return { easy: 0, medium: 0, hard: 0 };
            }
        };

        window.highscores = getLocalScores();
        window.user = null;

        // 2. Funksjon for å tegne opp rekordene i grensesnittet
        window.updateHighscoreUI = () => {
            const list = document.getElementById('highscore-display');
            if (!list) return;

            list.innerHTML = `
                <div class="mt-6 pt-6 border-t border-gray-100">
                    <p class="text-[10px] text-gray-400 font-black uppercase mb-3 text-center">Dine Rekorder</p>
                    <div class="flex justify-center gap-4">
                        <div class="text-center bg-green-50 px-3 py-2 rounded-xl min-w-[70px] border border-green-100">
                            <p class="text-[9px] text-green-600 font-bold uppercase">Enkel</p>
                            <p class="text-lg font-black text-green-700">${window.highscores.easy || 0}</p>
                        </div>
                        <div class="text-center bg-yellow-50 px-3 py-2 rounded-xl min-w-[70px] border border-yellow-100">
                            <p class="text-[9px] text-yellow-600 font-bold uppercase">Middels</p>
                            <p class="text-lg font-black text-yellow-700">${window.highscores.medium || 0}</p>
                        </div>
                        <div class="text-center bg-red-50 px-3 py-2 rounded-xl min-w-[70px] border border-red-100">
                            <p class="text-[9px] text-red-600 font-bold uppercase">Vanskelig</p>
                            <p class="text-lg font-black text-red-700">${window.highscores.hard || 0}</p>
                        </div>
                    </div>
                </div>
            `;
        };

        // 3. Prøv å koble til Firebase (vil feile stille hvis vi er i Google Sites uten variabler)
        let db = null;
        let auth = null;

        try {
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (error) {
                        console.warn("Auth error:", error);
                    }
                };

                auth.onAuthStateChanged((user) => {
                    window.user = user;
                    if (user && db) {
                        const scoreDocRef = db.doc(`artifacts/${appId}/users/${user.uid}/settings/scores`);
                        scoreDocRef.onSnapshot((docSnap) => {
                            if (docSnap.exists) {
                                const cloudScores = docSnap.data();
                                // Kombiner sky og lokale data
                                window.highscores = {
                                    easy: Math.max(window.highscores.easy, cloudScores.easy || 0),
                                    medium: Math.max(window.highscores.medium, cloudScores.medium || 0),
                                    hard: Math.max(window.highscores.hard, cloudScores.hard || 0)
                                };
                                localStorage.setItem(`scores_${appId}`, JSON.stringify(window.highscores));
                            }
                            window.updateHighscoreUI();
                        }, (error) => {
                            console.warn("Firestore listener error:", error);
                            window.updateHighscoreUI();
                        });
                    }
                });

                initAuth();
            }
        } catch (e) {
            console.warn("Kjører i lokal modus. Firebase er deaktivert.");
        }

        // 4. Sikker lagrefunksjon
        window.saveHighScore = async (difficulty, score) => {
            if (score > (window.highscores[difficulty] || 0)) {
                window.highscores[difficulty] = score;
                
                // Lagre lokalt (fungerer alltid)
                try {
                    localStorage.setItem(`scores_${appId}`, JSON.stringify(window.highscores));
                } catch(e) {}
                
                window.updateHighscoreUI();
                
                // Prøv å lagre til skyen hvis tilgjengelig
                if (window.user && db) {
                    const scoreDocRef = db.doc(`artifacts/${appId}/users/${window.user.uid}/settings/scores`);
                    try {
                        await scoreDocRef.set(window.highscores, { merge: true });
                    } catch (error) {
                        console.warn("Cloud save failed:", error);
                    }
                }
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            position: relative;
        }

        .word-letter {
            border-bottom: 3px solid #3b82f6;
            min-width: 32px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 4px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .letter-revealed { color: #10b981; border-bottom-color: #10b981; transform: scale(1.1); }
        .shake { animation: shake 0.4s both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .streak-badge {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .time-bonus {
            position: absolute;
            color: #10b981;
            font-weight: 900;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
    </style>
</head>

                { word: "HINDERNIS", de: "Etwas, das im Weg steht." },
                { word: "BEDEUTUNG", de: "Was ein Wort oder eine Sache aussagt." },
                { word: "FREIHEIT", de: "Das Recht, zu tun, was man möchte." },

        let currentDifficulty = 'easy';
        let currentWordIndex = 0;
        let score = 0;
        let streak = 0;
        let timeLeft = 60;
        let skipsLeft = 3;
        let timerInterval;
        let currentGuess = "";
        let gameWords = [];
        let isRevealing = false;

        const startScreen = document.getElementById('start-screen');
        const playScreen = document.getElementById('play-screen');
        const endScreen = document.getElementById('end-screen');
        const wordInput = document.getElementById('word-input');

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            gameWords = [...words[difficulty]].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            score = 0;
            streak = 0;
            timeLeft = 60;
            skipsLeft = 3;
            isRevealing = false;
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            playScreen.classList.remove('hidden');
            
            updateSkipsUI();
            updateScoreUI();
            updateStreakUI();
            nextWord();
            startTimer();
            setTimeout(() => wordInput.focus(), 300);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isRevealing) return;
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function showTimeBonus(seconds) {
            const anchor = document.getElementById('bonus-anchor');
            const bonus = document.createElement('div');
            bonus.className = 'time-bonus';
            bonus.innerText = `+${seconds}s`;
            anchor.appendChild(bonus);
            setTimeout(() => bonus.remove(), 1000);
        }

        function nextWord() {
            if (currentWordIndex >= gameWords.length) {
                gameWords = [...words[currentDifficulty]].sort(() => Math.random() - 0.5);
                currentWordIndex = 0;
            }
            const wordData = gameWords[currentWordIndex];
            document.getElementById('german-definition').innerText = wordData.de;
            document.getElementById('norwegian-definition').innerText = wordData.no || "";
            currentGuess = wordData.word[0];
            wordInput.value = "";
            isRevealing = false;
            renderWord();
        }

        function renderWord(revealed = false) {
            const targetWord = gameWords[currentWordIndex].word;
            const display = document.getElementById('word-display');
            display.innerHTML = "";
            for (let i = 0; i < targetWord.length; i++) {
                const span = document.createElement('span');
                span.classList.add('word-letter');
                if (revealed) {
                    span.innerText = targetWord[i];
                    span.classList.add('letter-revealed');
                } else {
                    span.innerText = i < currentGuess.length ? currentGuess[i] : "";
                    if (i < currentGuess.length) span.classList.add('text-blue-500');
                }
                display.appendChild(span);
            }
        }

        wordInput.addEventListener('input', (e) => {
            if (isRevealing) return;
            const targetWord = gameWords[currentWordIndex].word;
            const rawVal = e.target.value.toUpperCase();
            currentGuess = targetWord[0] + rawVal.substring(0, targetWord.length - 1);
            renderWord();
            
            if (currentGuess === targetWord) {
                isRevealing = true;
                streak++;
                score += (10 + Math.min(streak, 10));
                
                // Tidsbonus: +2 sekunder for riktig svar
                timeLeft = Math.min(timeLeft + 2, 60);
                document.getElementById('timer').innerText = timeLeft;
                showTimeBonus(2);

                updateScoreUI();
                updateStreakUI();
                setTimeout(() => {
                    currentWordIndex++;
                    nextWord();
                }, 400);
            } else if (currentGuess.length >= targetWord.length) {
                document.getElementById('word-display').classList.add('shake');
                streak = 0;
                updateStreakUI();
                setTimeout(() => {
                    document.getElementById('word-display').classList.remove('shake');
                    wordInput.value = "";
                    currentGuess = targetWord[0];
                    renderWord();
                }, 400);
            }
        });

        // Håndter tastatur-snarveier
        window.addEventListener('keydown', (e) => {
            if (playScreen.classList.contains('hidden')) return;
            
            // Bare Esc hopper over ord nå
            if (e.key === "Escape") {
                skipWord();
            }
        });

        function skipWord() {
            if (skipsLeft > 0 && !isRevealing) {
                skipsLeft--;
                streak = 0;
                updateSkipsUI();
                updateStreakUI();
                renderWord(true);
                isRevealing = true;
                setTimeout(() => {
                    currentWordIndex++;
                    nextWord();
                }, 800);
            }
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
        }
        
        function updateStreakUI() {
            const container = document.getElementById('streak-container');
            if (streak >= 2) {
                container.innerHTML = `<span class="streak-badge bg-orange-500 text-white text-[10px] font-black px-3 py-1 rounded-full italic uppercase shadow-lg shadow-orange-200 tracking-tighter">Combo x${streak}</span>`;
            } else {
                container.innerHTML = "";
            }
        }

        function updateSkipsUI() {
            const display = document.getElementById('skips-display');
            display.innerHTML = "";
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = `h-3 w-3 rounded-full shadow-sm ${i < skipsLeft ? 'bg-yellow-400' : 'bg-gray-200'}`;
                display.appendChild(dot);
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            playScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            const diffNames = { easy: "Enkel modus", medium: "Middels modus", hard: "Vanskelig modus" };
            document.getElementById('end-difficulty-text').innerText = diffNames[currentDifficulty];
            
            window.saveHighScore(currentDifficulty, score);
            
            document.getElementById('replay-btn').onclick = () => startGame(currentDifficulty);
        }

        function resetGame() {
            clearInterval(timerInterval);
            startScreen.classList.remove('hidden');
            playScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            window.updateHighscoreUI();
        }

        document.body.addEventListener('click', () => {
            if(!playScreen.classList.contains('hidden')) wordInput.focus();
        });

        // Forsikre oss om at UI oppdateres så fort siden er lastet
        window.addEventListener('DOMContentLoaded', () => {
            window.updateHighscoreUI();
        });

        window.onload = () => {
            window.updateHighscoreUI();
        };
    </script>
